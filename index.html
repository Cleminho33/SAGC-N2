<style>
:root{--ink:#0B0F0C;--ink-2:#131A15;--line-2:#37473A;--bone:#EAF0E8;--muted:#8D9A8E;--acid:#F2E400;--shot:#FF7A45;
  --grad:linear-gradient(160deg,#F2E400 0%,#C6D200 32%,#5FAE3C 68%,#009444 100%);
  --grad-flat:linear-gradient(90deg,#F2E400 0%,#A9C400 45%,#009444 100%)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font:400 16px/1.55 Archivo,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden}
.lock::before{content:"";position:absolute;inset:auto -20% -40% -20%;height:70%;background:var(--grad);opacity:.16;filter:blur(60px);border-radius:50%}
form{position:relative;width:100%;max-width:360px;text-align:center}
img{width:96px;height:96px;object-fit:contain}
h1{font:400 44px/.95 Anton,Impact,sans-serif;text-transform:uppercase;margin:18px 0 6px}
h1 span{background:var(--grad-flat);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);margin:0 0 26px;font-size:15px}
input[type=password]{width:100%;padding:15px 16px;border-radius:4px;border:1px solid var(--line-2);background:var(--ink-2);color:var(--bone);font:500 17px Archivo,sans-serif;text-align:center;letter-spacing:.12em}
input[type=password]:focus{outline:2px solid var(--acid);outline-offset:1px}
button{width:100%;margin-top:10px;padding:15px;border:0;border-radius:4px;background:var(--acid);color:var(--ink);font:600 14px/1 Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:14px;color:var(--muted)}
label input{accent-color:var(--acid);width:18px;height:18px}
.err{color:var(--shot);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>

const KEY = 'sagc-cle-' + P.s.slice(0, 8);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...u));
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(P.s), iterations:P.it}, base, 512);
  return new Uint8Array(bits);
}
async function open(raw){
  const encKey = await crypto.subtle.importKey('raw', raw.slice(0,32), 'AES-CBC', false, ['decrypt']);
  const macKey = await crypto.subtle.importKey('raw', raw.slice(32), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const iv = b64(P.iv), ct = b64(P.ct);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  if (!await crypto.subtle.verify('HMAC', macKey, b64(P.mac), signed)) throw new Error('mdp');
  const zipped = await crypto.subtle.decrypt({name:'AES-CBC', iv}, encKey, ct);
  const stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
function show(html){ document.open(); document.write(html); document.close(); }

(async () => {
  const saved = ls.get(KEY);
  if (saved){
    try { show(await open(b64(saved))); return; } catch(e){ ls.del(KEY); }
  }
  document.getElementById('lock').hidden = false;
  const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
  pw.addEventListener('input', () => err.textContent = '');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    go.disabled = true; go.textContent = 'Ouverture…';
    try {
      const raw = await derive(pw.value);
      const html = await open(raw);
      if (document.getElementById('keep').checked) ls.set(KEY, toB64(raw));
      show(html);
    } catch(e){
      err.textContent = e.message === 'mdp' ? 'Mauvais mot de passe' : 'Ce navigateur est trop ancien pour ouvrir le site';
      go.disabled = false; go.textContent = 'Entrer';
    }
  });
})();
