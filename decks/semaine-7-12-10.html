/* Écran de connexion de SAGC'TOUT. Cette page est publique (rien n'y est chiffré) :
   aucune info d'équipe, aucun nom, aucune photo. Le reste du site est déchiffré dessous. */
:root{--ink:#0B0F0C;--ink-2:#131A15;--line:rgba(234,240,232,.11);--line-2:#37473A;--bone:#EAF0E8;--muted:#8D9A8E;
  --acid:#F2E400;--green:#3FA845;--deep:#009444;--shot:#FF7A45;
  --grad-flat:linear-gradient(90deg,#F2E400 0%,#A9C400 45%,#009444 100%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font:400 16px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

/* ===== DÉCOR PARTAGÉ verrou / appli : halos, piste, schéma tactique, et l'écran de chargement (blason, nom, barre).
   Ce bloc est copié À L'IDENTIQUE dans app.html (écran de démarrage) : si on en change un, on change l'autre.
   --sc-off décale les animations pour que l'appli reprenne le décor là où le verrou l'a laissé. ===== */
.sc{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#0B0F0C}
.sc-glow{position:absolute;border-radius:50%;filter:blur(70px)}
.sc-g1{width:60vmax;height:60vmax;left:-18vmax;bottom:-28vmax;background:radial-gradient(circle,rgba(0,148,68,.55),transparent 65%);animation:scDrift 18s ease-in-out var(--sc-off,0s) infinite alternate}
.sc-g2{width:46vmax;height:46vmax;right:-14vmax;top:-20vmax;background:radial-gradient(circle,rgba(242,228,0,.28),transparent 65%);animation:scDrift 22s ease-in-out var(--sc-off,0s) infinite alternate-reverse}
@keyframes scDrift{to{transform:translate(6vmax,-4vmax) scale(1.08)}}
.sc-rink{position:absolute;top:50%;left:50%;width:min(1400px,96vw);aspect-ratio:2/1;transform:translate(-50%,-50%)}
@media (orientation:portrait){.sc-rink{width:min(94vh,200vw);transform:translate(-50%,-50%) rotate(90deg)}}
@media (max-width:860px){.sc-rink{opacity:.65}}
.sc-court{fill:none;stroke:rgba(234,240,232,.11);stroke-width:2}
.sc-spot{fill:rgba(234,240,232,.12)}
.sc-mk{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.sc-o{stroke:rgba(242,228,0,.34)}
.sc-x{stroke:rgba(111,190,95,.4)}
.sc-run{fill:none;stroke:rgba(242,228,0,.3);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  animation:scDraw 9s ease-in-out calc(var(--sc-off,0s) + var(--d,0s)) infinite}
@keyframes scDraw{0%,8%{stroke-dashoffset:var(--len);opacity:0}22%{opacity:1}40%,80%{stroke-dashoffset:0;opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
.sc-ball{fill:#F2E400;filter:drop-shadow(0 0 6px rgba(242,228,0,.9))}
.sc-vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(11,15,12,.85) 100%)}
.sc-load{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:0 16px}
.sc-crest{position:relative;width:112px;height:112px;display:grid;place-items:center}
.sc-crest::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(242,228,0,.22),transparent 68%)}
.sc-ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,rgba(242,228,0,.9) 75%,rgba(0,148,68,.9) 92%,transparent);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));
  animation:scSpin 1.6s linear var(--sc-off,0s) infinite}
@keyframes scSpin{to{transform:rotate(360deg)}}
.sc-crest img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.sc-word{margin:0;font:900 40px/.92 Inter,Arial,sans-serif;letter-spacing:-.035em;color:#EAF0E8}
.sc-word em{font-style:normal;background:linear-gradient(90deg,#F2E400 0%,#A9C400 45%,#009444 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc-bar{position:relative;width:132px;height:3px;border-radius:3px;background:rgba(234,240,232,.1);overflow:hidden}
.sc-bar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:3px;background:linear-gradient(90deg,#F2E400,#A9C400 45%,#009444);
  transform:translateX(-100%);animation:scBar 1.3s ease-in-out var(--sc-off,0s) infinite}
@keyframes scBar{to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){
  .sc-g1,.sc-g2,.sc-ring{animation:none}
  .sc-run{animation:none;stroke-dashoffset:0;opacity:1}
  .sc-bar::after{animation:none;transform:translateX(75%)}
}
/* ===== fin du décor partagé ===== */

.lock{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- mise en page ---------- */
.wrap{flex:1;width:100%;max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:72px;
  padding:calc(env(safe-area-inset-top) + 40px) 40px 24px}
.brand{min-width:0}
.crest{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:26px}
.crest::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(242,228,0,.22),transparent 68%)}
.ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,rgba(242,228,0,.9) 75%,rgba(0,148,68,.9) 92%,transparent);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));
  animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.crest img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.eyebrow{margin:0 0 10px;font:700 12px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:900 clamp(44px,7vw,84px)/.92 Inter,sans-serif;letter-spacing:-.035em}
h1 em{font-style:normal;background:var(--grad-flat);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin:18px 0 0;max-width:30ch;font-size:clamp(16px,1.6vw,19px);line-height:1.45;color:#C9D3C8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0;padding:0;list-style:none}
.chips li{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:rgba(234,240,232,.05);border:1px solid var(--line);
  font:600 13px/1 Inter,sans-serif;color:var(--bone)}
.chips svg{width:15px;height:15px;color:var(--acid)}

.card{position:relative;width:100%;max-width:420px;justify-self:end;padding:34px 32px 26px;border-radius:20px;
  background:linear-gradient(180deg,rgba(26,35,28,.78),rgba(15,21,17,.82));border:1px solid rgba(234,240,232,.1);
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.card::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:2px;border-radius:2px;background:var(--grad-flat)}
.card h2{margin:0;font:800 26px/1.1 Inter,sans-serif;letter-spacing:-.02em}
.card .sub{margin:6px 0 24px;font-size:14.5px;color:var(--muted)}
.field{position:relative}
.field > svg{position:absolute;left:16px;top:50%;width:19px;height:19px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#pw{width:100%;height:56px;padding:0 52px 0 46px;border-radius:12px;border:1px solid var(--line-2);background:rgba(5,8,6,.55);color:var(--bone);
  font:600 17px Inter,sans-serif;letter-spacing:.08em;transition:border-color .2s,box-shadow .2s}
#pw::placeholder{color:#6E7B6F;letter-spacing:0;font-weight:500}
#pw:focus{outline:none;border-color:var(--acid);box-shadow:0 0 0 4px rgba(242,228,0,.16)}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
#eye:hover{color:var(--bone)}
#eye svg{width:20px;height:20px}
#eye .off{display:none}
#eye[aria-pressed="true"] .on{display:none}
#eye[aria-pressed="true"] .off{display:block}
#go{position:relative;width:100%;height:56px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;overflow:hidden;
  background:var(--acid);color:var(--ink);font:800 15px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:transform .15s,box-shadow .2s}
#go:hover{box-shadow:0 10px 30px rgba(242,228,0,.28)}
#go:active{transform:scale(.98)}
#go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
#go svg{width:18px;height:18px;transition:transform .2s}
#go:hover svg{transform:translateX(3px)}
#go:disabled{cursor:progress}
#go .spin{display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(11,15,12,.25);border-top-color:var(--ink);animation:spin .7s linear infinite}
#go.busy .spin{display:block}
#go.busy svg{display:none}
.switch{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:14px;color:#B9C4B8;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{flex:none;position:relative;width:40px;height:24px;border-radius:999px;background:#2A362C;transition:background .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bone);transition:transform .2s}
.switch input:checked + .track{background:var(--deep)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--acid);outline-offset:2px}
.err{min-height:20px;margin-top:12px;color:var(--shot);font-size:14px;font-weight:600}
#retry{width:100%;height:48px;margin-top:10px;border:1px solid rgba(234,240,232,.25);border-radius:12px;background:none;color:inherit;font:700 15px/1 inherit;cursor:pointer}
.card.shake{animation:shake .42s ease}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.foot{padding:0 24px calc(env(safe-area-inset-bottom) + 18px);text-align:center;font:600 11px/1.4 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#5F6C60}

/* apparition */
.rise{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.r2{animation-delay:.08s}.r3{animation-delay:.16s}.r4{animation-delay:.24s}.r5{animation-delay:.32s}.r6{animation-delay:.22s}
@keyframes rise{to{opacity:1;transform:none}}
.lock.out .wrap{transition:opacity .25s,transform .25s;opacity:0;transform:scale(.98)}

/* ---------- téléphone ---------- */
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:26px;align-content:center;padding:calc(env(safe-area-inset-top) + 28px) 16px 16px;text-align:center}
  .crest{width:96px;height:96px;margin:0 auto 18px}
  .tagline{margin:12px auto 0;font-size:15.5px}
  .chips{justify-content:center;margin-top:18px;gap:6px}
  .chips li{padding:7px 10px;font-size:12px;gap:6px}
  .card{justify-self:center;padding:26px 20px 20px;text-align:left}
  .card h2{font-size:22px}
}
@media (max-width:860px) and (max-height:720px){.chips{display:none}.tagline{display:none}}
@media (prefers-reduced-motion:reduce){
  .ring,#go::after{animation:none}
  .rise{animation:none;opacity:1;transform:none}
}
</style>
</head>

const KEY = 'sagc-cle-' + P.s.slice(0, 8);
/* décodage en boucle : Uint8Array.from(atob(s), fn) passe par une liste de plusieurs millions de nombres,
   des centaines de Mo pour un deck de 15 Mo, de quoi faire échouer un iPhone (Clément, 12.10) */
const b64 = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const toB64 = u => btoa(String.fromCharCode(...u));
const gate = area => ({
  get(k){ try { return area().getItem(k); } catch(e){ return null; } },
  set(k,v){ try { area().setItem(k,v); } catch(e){} },
  del(k){ try { area().removeItem(k); } catch(e){} }
});
const lsGate = gate(() => localStorage), ssGate = gate(() => sessionStorage);

async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(P.s), iterations:P.it}, base, 512);
  return new Uint8Array(bits);
}
async function open(raw){
  const encKey = await crypto.subtle.importKey('raw', raw.slice(0,32), 'AES-CBC', false, ['decrypt']);
  const macKey = await crypto.subtle.importKey('raw', raw.slice(32), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const iv = b64(P.iv), ct = b64(P.ct);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  if (!await crypto.subtle.verify('HMAC', macKey, b64(P.mac), signed)) throw new Error('mdp');
  const zipped = await crypto.subtle.decrypt({name:'AES-CBC', iv}, encKey, ct);
  const stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
/* comptes (refonte des accès, 22.10) : un lien d'invitation (#entrer=…) ou son code à 6 chiffres ouvre l'appli au nom de la personne.
   Le service remet la clé de l'appli et une session, gardées sur l'appareil (sagc-session, sagc-compte) : plus rien à taper ensuite */
const NOTIF = 'https://sagc-notifs.clement-mora11.workers.dev';
const ERR_INV = {invitation: "Code inconnu : vérifie le message de Clément.", expiree: "Ce code a expiré : demande un nouveau lien à Clément.",
  servie: "Ce code a déjà servi sur 5 appareils : demande un nouveau lien à Clément.", trop: "Trop d'essais : réessaie dans une heure.",
  reseau: "Pas de réseau : réessaie quand tu en as.", cle: "L'appli se prépare : réessaie dans quelques minutes."};
const appareil = () => { const u = navigator.userAgent;
  return (/iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'PC' : 'Navigateur')
    + (navigator.standalone || matchMedia('(display-mode: standalone)').matches ? ' (appli)' : ''); };
async function service(chemin, corps, session){
  const r = await fetch(NOTIF + chemin, {method: 'POST', body: JSON.stringify(corps || {}),
    headers: {'Content-Type': 'application/json', ...(session ? {Authorization: 'Bearer ' + session} : {})}});
  return {statut: r.status, ...(await r.json().catch(() => ({})))};
}
function garder(d){
  if (d.session) lsGate.set('sagc-session', d.session);
  if (d.membre) lsGate.set('sagc-compte', JSON.stringify(d.membre));
  if (d.cle) lsGate.set('sagc-cle-' + d.sel, d.cle);
  if (d.fort) lsGate.set('sagc-fort', d.fort);
}
/* l'appli déchiffre ses vidéos (media/*.bin) avec la même clé : elle la reçoit ici, avec ou sans
   « Rester connecté ». Variable de la page, et sessionStorage, qui sert aussi aux decks ouverts dans
   l'appli et s'efface quand on ferme l'appli. */
function show(html, raw){
  const k = toB64(raw);
  window.SAGC_CLE = k;
  ssGate.set(KEY, k);
  document.open(); document.write(html); document.close();
}

(async () => {
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('sc-rink').pauseAnimations(); } catch(e){}
  /* la clé enregistrée n'est oubliée que si elle est fausse (mot de passe changé) : une ouverture ratée
     pour une autre raison (mémoire, chargement coupé) garde la connexion et propose de réessayer */
  let rate = false, msg = '';
  /* l'invitation est lue puis effacée de la barre d'adresse */
  const inv = (location.hash.match(/^#entrer=([\w-]{20,60})$/) || [])[1];
  if (inv){
    history.replaceState(null, '', location.pathname + location.search);
    try {
      const d = await service('/compte/entrer', {lien: inv, appareil: appareil()});
      if (d.ok){ garder(d); const raw = b64(d.cle); show(await open(raw), raw); return; }
      msg = ERR_INV[d.erreur] || ERR_INV.invitation;
    } catch(e){ msg = e.message === 'mdp' ? "L'appli vient d'être mise à jour : ferme-la et rouvre-la." : ERR_INV.reseau; }
  }
  for (const g of [lsGate, ssGate]){
    const saved = g.get(KEY);
    if (!saved) continue;
    try { const raw = b64(saved); show(await open(raw), raw); return; }
    catch(e){ if (e.message === 'mdp') g.del(KEY); else rate = true; }
  }
  /* un appareil connecté sans la clé de cette version (renouvelée, ou effacée) la redemande au service */
  const ses = lsGate.get('sagc-session');
  if (ses && !rate){
    try {
      const d = await service('/compte/moi', {}, ses);
      if (d.ok && d.cle){ garder(d); const raw = b64(d.cle); show(await open(raw), raw); return; }
      if (d.statut === 401 && d.erreur === 'session'){ lsGate.del('sagc-session'); lsGate.del('sagc-compte'); }
    } catch(e){}
  }
  const lock = document.getElementById('lock');
  document.getElementById('boot').hidden = true;
  lock.hidden = false;
  if (msg) document.getElementById('err').textContent = msg;
  if (rate){
    const r = document.getElementById('retry');
    r.hidden = false; r.addEventListener('click', () => location.reload());
    document.getElementById('err').textContent = "La page n'a pas pu s'ouvrir (téléphone à court de mémoire ?). Tu es toujours connecté.";
  }
  const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
  const lbl = go.querySelector('.lbl'), eye = document.getElementById('eye');
  eye.addEventListener('click', () => {
    const vis = pw.type === 'password';
    pw.type = vis ? 'text' : 'password';
    eye.setAttribute('aria-pressed', vis ? 'true' : 'false');
    eye.setAttribute('aria-label', vis ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    pw.focus();
  });
  pw.addEventListener('input', () => err.textContent = '');
  f.addEventListener('animationend', e => { if (e.animationName === 'shake') f.classList.remove('shake'); });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pw.value){ pw.focus(); f.classList.add('shake'); return; }
    go.disabled = true; go.classList.add('busy'); lbl.textContent = 'Ouverture…';
    try {
      let raw, html;
      try { raw = await derive(pw.value); html = await open(raw); }
      catch(e){
        /* six chiffres : le code d'invitation ; sinon le mot de passe de secours de Clément ou de Gaëtan (PC pro, 23.10) */
        if (e.message !== 'mdp') throw e;
        const code = pw.value.replace(/\s/g, ''), six = /^\d{6}$/.test(code);
        const d = await service(six ? '/compte/entrer' : '/compte/connexion', six ? {code, appareil: appareil()} : {mdp: pw.value, appareil: appareil()}).catch(() => ({erreur: 'reseau'}));
        if (!d.ok) throw new Error(!six && d.erreur === 'mdp' ? 'mdp' : 'code:' + (d.erreur || ''));
        garder(d); raw = b64(d.cle); html = await open(raw);
      }
      if (document.getElementById('keep').checked) lsGate.set(KEY, toB64(raw));
      lock.classList.add('out');
      setTimeout(() => show(html, raw), 200);
    } catch(e){
      err.textContent = e.message === 'mdp' ? 'Mauvais mot de passe, réessaie.' : e.message.startsWith('code:') ? ERR_INV[e.message.slice(5)] || ERR_INV.invitation
        : 'Ce navigateur est trop ancien pour ouvrir le site.';
      go.disabled = false; go.classList.remove('busy'); lbl.textContent = 'Entrer';
      f.classList.add('shake'); pw.select();
    }
  });
})();
})();
