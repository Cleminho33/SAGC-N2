<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F0C">
<meta name="robots" content="noindex">
<title>SAGC'TOUT · Vidéo</title>
<link rel="stylesheet" href="fonts/polices.css">
<!-- Module vidéo de SAGC'TOUT, lot 1 (Clément, 18.11) : marquer les actions d'un match sur sa vidéo YouTube.
     Page publiée en clair à côté de l'appli : elle ne contient aucune donnée. Tout passe par le service sagc-video
     (livrables/Rink/site/video/worker.js), avec la session de SAGC'TOUT (même adresse, même stockage).
     L'appli lui laisse le contexte dans localStorage « sagc-video-ctx » : {matchs: [{k, titre}], joueurs: [{id, nom, num}]}.
     Voir livrables/Rink/MODULE-VIDEO-CADRAGE.md. -->
<style>
:root{
  --ink:#0B0F0C; --ink-2:#131A15; --ink-3:#1B241D; --line:#26332A; --line-2:#37473A;
  --bone:#EAF0E8; --muted:#8D9A8E; --acid:#F2E400; --grass:#3FA845; --deep:#009444; --away:#6FA8D8; --shot:#FF7A45;
  --grad-flat:linear-gradient(90deg,#F2E400 0%,#A9C400 45%,#009444 100%);
  --r-s:10px; --r-l:18px; --r-pill:999px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--bone);font:400 15px/1.5 Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1320px;margin:0 auto;padding:16px 16px 48px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;font:600 12px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font:600 11px/1.2 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.h1{font:400 clamp(30px,5vw,46px)/1 Anton,Impact,sans-serif;text-transform:uppercase;font-style:italic;margin:6px 0 0}
.rule{height:3px;width:72px;background:var(--grad-flat);border-radius:var(--r-pill);margin:14px 0 20px}
.muted{color:var(--muted)}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:var(--r-s);font:600 13px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.btn-acid{background:var(--acid);color:var(--ink)}
.btn-ghost{border:1px solid var(--line-2)}
.btn:disabled{opacity:.5;cursor:default}
.champ{width:100%;padding:12px 14px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--ink-3);font-size:15px}
.champ:focus{outline:2px solid var(--acid);outline-offset:1px}
.msg{font-size:14px;margin:10px 0 0;min-height:1.4em}
.msg.err{color:var(--shot)}

/* le choix du match */
.liste{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.mt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-radius:var(--r-l);background:var(--ink-2);border:1px solid var(--line)}
.mt:hover{border-color:var(--line-2)}
.mt b{font-weight:800;font-size:16px}
.mt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.pas{font:600 11px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pas.ok{border-color:var(--grass);color:var(--grass)}

/* le marquage */
.grille{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 360px;align-items:start}
@media (max-width:980px){.grille{grid-template-columns:1fr}}
.ecran{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line)}
.ecran iframe,.ecran #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.barre{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.barre[hidden]{display:none}
.camp{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:3px;margin-right:6px}
.camp button{padding:9px 14px;border-radius:var(--r-pill);font:700 12px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.camp button.on[data-camp=nous]{background:var(--grass);color:var(--ink)}
.camp button.on[data-camp=eux]{background:var(--away);color:var(--ink)}
.act{display:inline-flex;align-items:center;gap:8px;padding:11px 13px;border-radius:var(--r-s);background:var(--ink-3);border:1px solid var(--line-2);font-weight:600;font-size:14px;transition:transform .12s,border-color .12s}
.act:hover{border-color:var(--bone)}
.act kbd{font:700 11px/1 Inter,sans-serif;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:3px 5px}
.act.but{background:var(--acid);border-color:var(--acid);color:var(--ink)}
.act.but kbd{color:var(--ink);border-color:rgba(11,15,12,.35)}
.act.flash{transform:scale(.94)}
.aide{font-size:12.5px;color:var(--muted);margin-top:10px}
.aide kbd{font:700 11px/1 Inter,sans-serif;border:1px solid var(--line-2);border-radius:5px;padding:2px 5px;color:var(--bone)}
.qui{margin-top:12px;padding:12px;border-radius:var(--r-s);background:var(--ink-2);border:1px solid var(--line-2)}
.qui p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.qui p b{color:var(--bone)}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{padding:7px 11px;border-radius:var(--r-pill);border:1px solid var(--line-2);font-size:13px;font-weight:600}
.puce:hover{border-color:var(--bone)}
.puce em{font-style:normal;color:var(--muted);margin-right:4px}

.cote h2{font:800 18px/1.2 Inter,sans-serif;margin:0}
.bilan{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:13px;margin:12px 0 4px}
.bilan span:nth-child(3n+2){color:var(--grass);font-weight:700;text-align:right}
.bilan span:nth-child(3n){color:var(--away);font-weight:700;text-align:right}
.bilan .tete{font:600 10.5px/1.4 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)!important}
.mqs{list-style:none;margin:14px 0 0;padding:0;max-height:62vh;overflow:auto;border-top:1px solid var(--line)}
.mq{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.mq.neuf{animation:neuf .9s ease-out}
@keyframes neuf{from{background:rgba(242,228,0,.16)}to{background:transparent}}
.mq .va{flex:1;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.mq time{font:700 13px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;min-width:52px;color:var(--bone)}
.mq .pt{width:8px;height:8px;border-radius:50%;flex:none}
.mq .pt.nous{background:var(--grass)}.mq .pt.eux{background:var(--away)}
.mq b{font-weight:600;font-size:14px}
.mq small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mq .x{width:30px;height:30px;border-radius:var(--r-pill);color:var(--muted);font-size:18px;line-height:1}
.mq .x:hover{color:var(--bone);background:var(--ink-3)}
.vide{color:var(--muted);font-size:14px;padding:14px 0}
.toast{position:fixed;left:50%;bottom:22px;translate:-50% 0;background:var(--ink-3);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:9}
.toast button{font-weight:700;color:var(--acid);padding:6px 8px}
.lien{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lien .champ{flex:1 1 320px}
/* le dessin sur la vidéo en pause (étape 2, 18.11) : un calque par-dessus le lecteur, en coordonnées 1600 × 900 */
.calque{position:absolute;inset:0;z-index:2}
.calque[hidden]{display:none}
.calque svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.calque.edit{cursor:crosshair;touch-action:none;background:rgba(11,15,12,.08);box-shadow:inset 0 0 0 3px var(--acid)}
.calque.lecture{pointer-events:none}
.calque.lecture .cq-bas{pointer-events:auto}
.cq-bas{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.cq-bas .btn{box-shadow:0 6px 18px rgba(0,0,0,.45)}
.cq-tx{position:absolute;min-width:160px;padding:8px 10px;border-radius:8px;border:2px solid var(--acid);background:rgba(11,15,12,.9);font:800 15px Inter,sans-serif;outline:none}
.act.dess{border-style:dashed}
.outils{margin-top:12px;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-l);background:var(--ink-2);border:1px solid var(--acid)}
.outils[hidden]{display:none}
.outils .sur{font-size:13px;color:var(--muted);margin:0}
.outils .sur b{color:var(--bone)}
.outils .sur b.choisi{color:var(--acid)}
/* l'éditeur de dessin (18.11) : une ligne d'outils, une ligne de mise en forme, une ligne d'actions */
.ou-l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ou-f{padding:8px 10px;border-radius:var(--r-s);background:var(--ink-3)}
.ou-g{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;padding-right:10px;margin-right:2px;border-right:1px solid var(--line-2)}
.ou-g:last-child{border-right:0}
.ou-g .lb{margin-right:2px}
.ot.mini{padding:6px 9px;font-size:12.5px}
.ot.sup{color:#FF9A8F;border-color:rgba(255,154,143,.45)}
.ou-f .coul{width:24px;height:24px}
.coul[data-co="#0b0f0c"]{box-shadow:0 0 0 1px var(--muted)}
.ot{display:inline-flex;align-items:center;gap:6px;padding:9px 11px;border-radius:var(--r-s);border:1px solid var(--line-2);font-weight:600;font-size:13.5px}
.ot.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.ot svg{width:16px;height:16px}
.coul{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink-2);box-shadow:0 0 0 1px var(--line-2)}
.coul.on{box-shadow:0 0 0 2px var(--bone)}
.outils .esp{flex:1}
.mq.sel{background:rgba(242,228,0,.07)}
.lb{font-size:12.5px;color:var(--muted)}
.esp{flex:1}
/* la frise du match, ligne de vie (Clément, 18.11, maquette A) : Cestas au-dessus, l'adversaire en dessous, pastilles sur tiges,
   buts en grand avec le score, fautes numérotées (coup franc direct en orange), supériorités et infériorités dans l'axe */
.fw{margin-top:10px;padding:12px 14px 10px;border-radius:var(--r-l);background:var(--ink-2);border:1px solid var(--line)}
.fw-haut{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.fw-eq{font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.fw-eq::before{content:'';width:9px;height:9px;border-radius:50%}
.fw-eq.n::before{background:var(--grass)}.fw-eq.e::before{background:var(--away)}
.fw-eq b{font:400 15px/1 Anton,Impact,sans-serif;font-style:italic;letter-spacing:.03em;color:var(--bone)}
.fw-eq b.alerte{color:var(--shot)}
.fw-z{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.fw-z .ot{padding:5px 9px;font-size:12px}
.fa{position:relative;height:162px;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden;touch-action:pan-y}
.fa i{position:absolute;display:block;font-style:normal}
.fa-axe{left:0;right:0;top:72px;height:18px;border-radius:9px;background:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.fa-iv{top:75px;height:12px;border-radius:6px;z-index:1}
.fa-iv.sup{background:var(--acid);box-shadow:0 0 0 3px rgba(242,228,0,.18)}
.fa-iv.inf{background:var(--shot);box-shadow:0 0 0 3px rgba(255,122,69,.18)}
.fa-iv.ouvert{background-image:repeating-linear-gradient(45deg,rgba(11,15,12,.35) 0 6px,transparent 6px 12px);background-size:17px 17px;animation:raye 1s linear infinite}
.fa-iv b{position:absolute;left:6px;top:0;font:900 9.5px/12px Inter,sans-serif;color:var(--ink);white-space:nowrap}
.fa-iv.sel{outline:2px solid var(--bone);outline-offset:2px}
@keyframes raye{to{background-position:17px 0}}
.fa-clip{top:72px;height:18px;border-radius:9px;background:rgba(234,240,232,.16);box-shadow:inset 0 0 0 1px rgba(234,240,232,.55);z-index:1;pointer-events:none}
.fa .fa-ev{translate:-50% 0;display:flex;flex-direction:column;align-items:center;z-index:2}
.fa-ev .tige,.fa-ev .pa,.fa-ev .sc{display:block;flex:none}
.fa-ev .pa{display:flex}
.fa-ev .tige{width:2px;background:var(--line-2)}
.fa-ev .pa{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink-2);font:800 9px/1 Inter,sans-serif;transition:transform .15s}
.fa-ev .pa svg{width:12px;height:12px}
.fa-ev:hover{z-index:4}.fa-ev:hover .pa{transform:scale(1.3)}
.fa-ev.sel{z-index:5}.fa-ev.sel .pa{transform:scale(1.3);box-shadow:0 0 0 2px var(--bone)}
.fa-ev.nous .pa{background:var(--grass);color:var(--ink)}
.fa-ev.eux .pa{background:var(--away);color:var(--ink)}
.fa-ev.but .pa{width:30px;height:30px;background:var(--acid);color:var(--ink)}
.fa-ev.but.eux .pa{background:var(--bone);color:#1f2b4a}
.fa-ev.but .pa svg{width:16px;height:16px}
.fa-ev .sc{font:400 15px/1 Anton,Impact,sans-serif;font-style:italic;letter-spacing:.03em;color:var(--acid);margin:0 0 3px;white-space:nowrap}
.fa-ev.eux .sc{margin:3px 0 0;color:var(--bone)}
.fa-ev.faute .pa{width:17px;height:17px;background:var(--ink-3);border-color:var(--line-2);color:var(--muted);border-radius:5px}
.fa-ev.faute.cfd .pa{width:24px;height:24px;background:var(--shot);color:var(--ink);border-color:var(--ink-2);border-radius:6px;font-size:8px}
.fa-ev.moment .pa{background:var(--ink-3);color:var(--bone);border-color:var(--line-2)}
.fa-tete{top:50px;height:62px;width:2px;margin-left:-1px;background:var(--bone);pointer-events:none;z-index:6}
.fa-tete::before{content:'';position:absolute;top:-7px;left:-5px;border:6px solid transparent;border-top-color:var(--bone)}
.fw-temps{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.fw-leg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:11.5px}
.fw-leg span{display:inline-flex;align-items:center;gap:5px}
.fw-leg i{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--ink-3);color:var(--bone);font-style:normal}
.fw-leg i svg{width:10px;height:10px}
.fw-leg i.b{background:var(--acid);color:var(--ink)}.fw-leg i.f{border-radius:4px;border:1px solid var(--line-2)}.fw-leg i.cfd{border-radius:4px;background:var(--shot)}
.fw-leg i.sup{width:18px;height:8px;border-radius:4px;background:var(--acid)}.fw-leg i.inf{width:18px;height:8px;border-radius:4px;background:var(--shot)}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink-3);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:250px}
.tip b{display:block;font-size:13.5px}
.tip em{font-style:normal;color:var(--acid)}
.tip small{color:var(--muted);font-size:12px}
/* le score par-dessus la vidéo, tenu à jour par les buts tagués */
.bug{position:absolute;left:12px;top:12px;z-index:3;display:flex;align-items:stretch;border-radius:8px;overflow:hidden;font:800 13px/1 Inter,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:none}
.bug:empty,.ecran:has(.calque.edit) .bug{display:none}
.bug span{display:flex;align-items:center;gap:7px;padding:7px 10px;background:rgba(11,15,12,.9);text-transform:uppercase;letter-spacing:.02em}
.bug .sc{background:var(--acid);color:var(--ink);font:400 19px/1 Anton,Impact,sans-serif;font-style:italic;padding:5px 11px;letter-spacing:.04em}
.bug img,.bug .crest{width:20px;height:20px;border-radius:50%;object-fit:contain;background:#fff}
.bug .crest{display:inline-flex;align-items:center;justify-content:center;background:var(--ink-3);color:var(--bone);font:800 7.5px/1 Inter,sans-serif}
/* la carte du tag choisi : ▶ Rejouer · ⏱ Régler · ✏️ Dessin · ✕ ; les − / + seulement après « Régler » */
.selc{margin-top:10px;padding:10px 12px;border-radius:var(--r-s);background:var(--ink-3);border:1px solid var(--line-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;animation:selIn .2s ease}
@keyframes selIn{from{opacity:0;transform:translateY(-4px)}}
.selc .q{font-weight:700;font-size:14px}
.selc .q small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.selc .q small em{font-style:normal;color:var(--acid)}
.selc .ot{padding:8px 11px}
.selc .x2{width:34px;justify-content:center}
.rgl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;padding-top:10px;margin-top:2px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.rgl b{color:var(--bone);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.rgl .ot{padding:6px 10px}
.rgl .btn{padding:9px 14px}
.lien-mini{font-size:12px;color:var(--muted);text-decoration:underline;margin-left:4px}
.act.ouvert{border-color:var(--acid);box-shadow:0 0 0 2px rgba(242,228,0,.3);animation:pulse 1.4s ease-in-out infinite}
.act.inf.ouvert{border-color:var(--shot);box-shadow:0 0 0 2px rgba(255,122,69,.3)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(242,228,0,.12)}}
/* les durées par catégorie */
.rg{margin-top:10px;padding:12px;border-radius:var(--r-s);background:var(--ink-2);border:1px solid var(--line-2)}
.rg-t{margin:0 0 8px;font-size:13.5px}
.rg-l{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rg .btn{padding:9px 12px}
.du{display:grid;grid-template-columns:minmax(110px,auto) auto auto;gap:6px 14px;align-items:center;font-size:13.5px}
.du .ot{padding:6px 10px}
.du-c{display:inline-flex;align-items:center;gap:6px}
.du-c b{min-width:34px;text-align:center}
.mq .crayon{font-size:13px;margin-left:4px}
.haut{display:flex;align-items:center;justify-content:space-between;gap:12px}
.aide-btn{width:36px;height:36px;border-radius:var(--r-pill);border:1px solid var(--line-2);font:800 15px/1 Inter,sans-serif;color:var(--muted)}
.aide-btn:hover{color:var(--bone);border-color:var(--bone)}

/* le pas-à-pas de la première fois (Clément, 18.11) : comment c'est câblé, puis comment s'en servir */
.gd{position:fixed;inset:0;z-index:20;background:rgba(5,8,6,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:gdIn .25s ease}
@keyframes gdIn{from{opacity:0}}
.gd-c{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--ink-2);border:1px solid var(--line-2);border-radius:var(--r-l);padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.gd-num{font:600 11px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.gd-t{font:400 30px/1.05 Anton,Impact,sans-serif;font-style:italic;text-transform:uppercase;margin:8px 0 12px}
.gd-t em{font-style:inherit;color:var(--acid)}
.gd-p{margin:0 0 6px;font-size:15px}
.gd-p.m{color:var(--muted);font-size:13.5px}
.gd-vis{height:150px;margin:4px 0 16px;border-radius:var(--r-s);background:var(--ink);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px}
.gd-pas{animation:pasIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pasIn{from{opacity:0;transform:translateX(18px)}}
.gd-pas.ret{animation-name:pasRet}

/* ---------- le Cockpit (Clément, 20.11) : tout le marquage tient dans un écran d'ordinateur, sans défiler ----------

}

<body>
<div class="wrap">
  <div class="haut"><a class="back" id="retour" href="./#/stats/club">← SAGC'TOUT</a><button type="button" class="aide-btn" id="guide-btn" aria-label="Comment ça marche" title="Comment ça marche">?</button></div>
  <main id="v" aria-live="polite"></main>
</div>
<script>
(() => {
'use strict';
const VIDEO_URL = window.VIDEO_URL || 'https://sagc-video.clement-mora11.workers.dev';
/* dans l'appli (18.11) : la page est ouverte en plein écran par-dessus SAGC'TOUT, dans un cadre ; on change d'écran sans
   ajouter d'étape à l'historique, pour que le retour du téléphone ferme la vidéo d'un coup, comme une fiche */
const DANS_APPLI = (() => { try { return window.parent !== window; } catch(e){ return true; } })();
function va(k){
  if (DANS_APPLI){ try { history.replaceState(null, '', k ? '#' + k : location.pathname); } catch(e){} route(); }
  else location.hash = k;
}
function fermer(){
  if (DANS_APPLI) parent.postMessage({sagcVideo: 'fermer'}, location.origin);
  else location.href = './#/stats/club';
}
const ACTIONS = [
  ['but', 'But'], ['tir', 'Tir'], ['arret', 'Arrêt'], ['perte', 'Perte de balle'],
  ['recup', 'Récupération'], ['faute', 'Faute'], ['sup', 'Supériorité'], ['inf', 'Infériorité']];
/* « moment » : le tag posé par Dessiner quand aucun tag n'est là (pas de bouton ni de touche à lui) */
const NOM_ACTION = {...Object.fromEntries(ACTIONS), moment: 'Moment'};
/* les tuiles du Cockpit (20.11) : un pictogramme et une couleur par action */
const TUILE = {but: ['🥅', 'var(--acid)'], tir: ['🎯', 'var(--bone)'], arret: ['🧤', 'var(--away)'], perte: ['💨', 'var(--shot)'],
  recup: ['🧲', 'var(--grass)'], faute: ['⚠️', 'var(--shot)'], sup: ['⬆️', 'var(--acid)'], inf: ['⬇️', 'var(--shot)'], moment: ['✏️', 'var(--bone)']};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const lire = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const ctx = (() => { try { return JSON.parse(lire('sagc-video-ctx') || '{}') || {}; } catch(e){ return {}; } })();
const MATCHS = Array.isArray(ctx.matchs) ? ctx.matchs : [], JOUEURS = Array.isArray(ctx.joueurs) ? ctx.joueurs : [];
const nomJoueur = id => { const j = JOUEURS.find(x => x.id === id); return j ? j.nom : id; };
const titreMatch = k => (MATCHS.find(x => x.k === k) || {}).titre || k;
const hms = t => { t = Math.max(0, Math.floor(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };

/* le service : la session de SAGC'TOUT ; « reseau » si le service ne répond pas (pas encore créé, pas de réseau) */
async function api(chemin, corps){
  const ses = lire('sagc-session');
  let r;
  try {
    r = await fetch(VIDEO_URL + chemin, {method: 'POST', headers: {'Content-Type': 'application/json', ...(ses ? {Authorization: 'Bearer ' + ses} : {})}, body: JSON.stringify(corps || {})});
  } catch(e){ return {ok: false, erreur: 'reseau'}; }
  const d = await r.json().catch(() => null);
  return d || {ok: false, erreur: 'reseau'};
}
const RAISON = {
  compte: "Connecte-toi d'abord dans SAGC'TOUT, sur cet appareil, puis reviens ici.",
  lecture: 'Ton compte peut regarder, pas marquer.',
  fort: "Confirme d'abord ton identité dans SAGC'TOUT (Face ID ou mot de passe de secours), puis reviens ici.",
  reseau: "Le service vidéo ne répond pas. S'il vient d'être ajouté, il n'est peut-être pas encore en place dans Cloudflare.",
  lien: "Ce lien n'est pas une vidéo YouTube. Colle l'adresse de la vidéo (youtube.com/watch?v=… ou youtu.be/…).",
  plein: 'Trop de marqueurs sur ce match.', service: 'Le service a eu un souci. Réessaie dans un instant.'
};
const raison = d => RAISON[d && d.erreur] || "Ça n'a pas marché. Réessaie dans un instant.";

/* ---------- le choix du match ---------- */
async function vueChoix(){
  document.title = "SAGC'TOUT · Vidéo";
  const v = $('#v');
  v.innerHTML = `<div class="eyebrow">Après le match</div><h1 class="h1">Vidéo des matchs</h1><div class="rule"></div>
    ${MATCHS.length ? `<p class="muted" style="margin-top:0">Choisis le match à marquer.</p><div class="liste">${MATCHS.slice().sort((a, b) => (b.iso || '').localeCompare(a.iso || '')).map(m => `<a class="mt" href="#${esc(m.k)}" data-k="${esc(m.k)}"><span><b>${esc(m.titre)}</b><small>${esc(m.d || '')}</small></span><span class="pas" data-pas="${esc(m.k)}">Pas de vidéo</span></a>`).join('')}</div>`
      : `<div class="card"><p style="margin:0">Ouvre cette page depuis SAGC'TOUT : <b>Stats › Notre club › Marquer la vidéo</b>.</p></div>`}
    <p class="msg" id="msg"></p>`;
  v.onclick = e => { const a = e.target.closest('a.mt[data-k]'); if (a){ e.preventDefault(); va(a.dataset.k); } };
  if (!MATCHS.length) return;
  const d = await api('/matchs');
  if (!d.ok){ $('#msg').textContent = raison(d); $('#msg').className = 'msg err'; return; }
  d.matchs.forEach(m => { const p = document.querySelector(`[data-pas="${CSS.escape(m.match)}"]`); if (p){ p.textContent = m.n ? `${m.n} action${m.n > 1 ? 's' : ''}` : 'Vidéo, rien de marqué'; p.classList.add('ok'); } });
}

/* ---------- le marquage d'un match ---------- */
let M = null;   // {k, video, marqueurs, ecrire, camp, dernier}
let joueur = null, ytPret = null;
let D = null;   // le dessin en cours : {mq, f: formes, outil, couleur, cur: forme qu'on trace}

function ytCharger(){
  if (ytPret) return ytPret;
  ytPret = new Promise((ok, ko) => {
    if (window.YT && window.YT.Player) return ok();
    window.onYouTubeIframeAPIReady = () => ok();

async function marquer(action){

  if (estIv({action})){
    const ouvert = M.marqueurs.find(m => m.action === action && m.t2 == null && typeof m.id === 'number');
    if (ouvert){
      const t2 = Math.max(ouvert.t, Math.round(maintenant() * 10) / 10);
      ouvert.t2 = t2; M.sel = ouvert; liste();
      const d = await api('/marqueur/modifier', {id: ouvert.id, t2});
      if (!d.ok){ ouvert.t2 = null; liste(); toast(raison(d)); return; }
      Object.assign(ouvert, d.marqueur); liste();

    }
  }
  const tmp = {id: 'tmp' + Date.now(), t: Math.round(maintenant() * 10) / 10, action, camp: M.camp, joueur: '', neuf: true, t2: null};
  /* en direct, pas de carte de tag : elle ne s'ouvre qu'au clic sur un tag (Clément, 18.11 : « sinon ce n'est pas jouable ») */
  M.marqueurs.push(tmp); M.sel = tmp; M.carte = false; M.regle = false; liste();
  if (estIv(tmp)){ $('#qui').innerHTML = ''; M.dernier = tmp; } else demanderJoueur(tmp);

  const i = M.marqueurs.indexOf(tmp);

  const vrai = {...d.marqueur, neuf: true};
  if (i >= 0) M.marqueurs[i] = vrai;
  if (M.sel === tmp) M.sel = vrai;
  /* un joueur choisi pendant l'envoi */
  if (tmp.joueur){ vrai.joueur = tmp.joueur; api('/marqueur/modifier', {id: vrai.id, joueur: tmp.joueur}); }
  if (M.dernier === tmp) M.dernier = vrai;

}

}

/* ---------- la frise du match et les clips (Clément, 18.11) ----------
   Frise C : nous au-dessus, eux en dessous, supériorités et infériorités en bande au milieu. Chaque tag est un clip :
   de l'instant moins « avant » à l'instant plus « après » (durées de sa catégorie, ou les siennes) ; un intervalle va de t à t2. */
const DUREES_DEF = {but: [8, 3], tir: [5, 2], arret: [5, 2], perte: [4, 3], recup: [4, 3], faute: [4, 2], moment: [3, 3]};
const estIv = m => m.action === 'sup' || m.action === 'inf';
const dureesDe = a => ((M && M.reglages && M.reglages.durees) || {})[a] || DUREES_DEF[a] || [5, 2];
const avDe = m => m.av != null ? m.av : dureesDe(m.action)[0];
const apDe = m => m.ap != null ? m.ap : dureesDe(m.action)[1];
const debutClip = m => estIv(m) ? m.t : Math.max(0, m.t - avDe(m));
const finClip = m => estIv(m) ? (m.t2 != null ? m.t2 : Math.max(m.t, maintenant())) : m.t + apDe(m);
let DUREE = 0, Z = null, boucle = null, lecture = null;
function dureeVideo(){
  let d = 0; try { d = joueur && joueur.getDuration ? joueur.getDuration() : 0; } catch(e){}
  if (!d) d = Math.max(600, ...M.marqueurs.map(m => finClip(m) + 60));
  return d;
}
/* ce qu'on voit de la frise : [a, b] en secondes (Z), tout le match par défaut */
function fenetre(){
  DUREE = dureeVideo();
  if (!Z) return [0, DUREE];
  const l = Math.max(20, Math.min(DUREE, Z[1] - Z[0])), a = Math.max(0, Math.min(DUREE - l, Z[0]));
  return [a, a + l];
}
/* ---------- la frise, ligne de vie (maquette A choisie par Clément, 18.11) ----------
   Pastilles sur tiges : Cestas au-dessus de l'axe, l'adversaire en dessous ; buts en grand avec le score ; fautes d'équipe
   numérotées, la 10e (puis 15e, 20e…) en orange : coup franc direct pour l'autre équipe ; supériorités et infériorités dans l'axe.
   Deux pastilles qui se touchent montent d'un cran. Hauteurs en px : axe de 106 à 124 sur 230. */
const FA_H = 162, FA_AXE = 72;   // compacte pour le Cockpit (20.11) : 2 rangs de pastilles au lieu de 3
const TIGE = {but: 18, arret: 20, tir: 14, recup: 8, perte: 8, moment: 12, faute: 4};
const IC = {
  but: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>',
  tir: '<svg viewBox="0 0 16 16"><path d="M2 14L13 3M13 3H7.5M13 3v5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  arret: '<svg viewBox="0 0 16 16"><path d="M8 1.5l5.5 2v4.5c0 3.3-2.4 5.6-5.5 6.5-3.1-.9-5.5-3.2-5.5-6.5V3.5z" fill="currentColor"/></svg>',
  perte: '<svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  recup: '<svg viewBox="0 0 16 16"><path d="M13 6a5 5 0 0 0-9-1.5M3 10a5 5 0 0 0 9 1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3.5 1.5v3.5H7M12.5 14.5V11H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  moment: '<svg viewBox="0 0 16 16"><path d="M3 13l1-3.5L11 2.5l2.5 2.5L6.5 12z" fill="currentColor"/></svg>'
};
const leMatch = () => MATCHS.find(x => x.k === (M && M.k)) || {};
const nomCamp = c => c === 'nous' ? 'Cestas' : leMatch().adv || 'Adversaire';
/* score au fil des buts, numéro de chaque faute d'équipe et coup franc direct (10e, 15e, 20e… de l'équipe) */
function analyse(){
  const info = new Map(), nf = {nous: 0, eux: 0}; let n = 0, e = 0;
  M.marqueurs.filter(m => !estIv(m)).slice().sort((p, q) => p.t - q.t).forEach(m => {
    if (m.action === 'but'){ m.camp === 'nous' ? n++ : e++; info.set(m, {score: `${n}-${e}`}); }
    else if (m.action === 'faute'){ const k = ++nf[m.camp]; info.set(m, {n: k, cfd: k >= 10 && (k - 10) % 5 === 0}); }
  });
  return info;
}
const compter = (t, a, c) => M.marqueurs.filter(m => m.action === a && m.camp === c && m.t <= t).length;
function detailTag(m, info){
  const x = info.get(m) || {};
  if (m.action === 'but') return `<em>${x.score || ''}</em>${m.joueur ? ' · ' + esc(nomJoueur(m.joueur)) : ''}`;
  if (m.action === 'faute') return `${x.n || '?'}e faute d'équipe${x.cfd ? ` · <em>coup franc direct pour ${esc(nomCamp(m.camp === 'nous' ? 'eux' : 'nous'))}</em>` : ''}`;
  if (estIv(m)) return m.t2 == null ? 'en cours' : `${hms(m.t2 - m.t)} de vidéo`;
  return m.joueur ? esc(nomJoueur(m.joueur)) : '';
}
const titreTag = m => `${esc(NOM_ACTION[m.action] || m.action)} · ${esc(nomCamp(m.camp))}`;

function friseDessiner(){
  const f = $('#frise'); if (!f || !M) return;
  const [a, b] = fenetre(), W = f.clientWidth || 900, X = s => (s - a) / (b - a) * 100, PX = s => (s - a) / (b - a) * W;
  const info = analyse(), parts = ['<i class="fa-axe"></i>'];
  const sel = M.sel && typeof M.sel.id === 'number' ? M.sel : null;
  if (sel && M.carte && !estIv(sel)){ const s = Math.max(a, debutClip(sel)), e = Math.min(b, finClip(sel)); if (e > s) parts.push(`<i class="fa-clip" style="left:${X(s)}%;width:${X(e) - X(s)}%"></i>`); }
  M.marqueurs.forEach((m, i) => {
    if (!estIv(m)) return;
    const s = Math.max(a, m.t), e = Math.min(b, finClip(m)); if (e < a || s > b) return;
    const w = Math.max(.6, X(e) - X(s));
    parts.push(`<i class="fa-iv ${m.action}${m.t2 == null ? ' ouvert' : ''}${sel === m ? ' sel' : ''}" data-i="${i}" style="left:${X(s)}%;width:${w}%">${w > 4 ? `<b>${m.action === 'sup' ? 'SUP' : 'INF'}</b>` : ''}</i>`);
  });
  ['nous', 'eux'].forEach(c => {
    /* les buts d'abord : ils restent au premier rang et prennent aussi la place du deuxième (leur score) ;
       les autres montent d'un cran tant qu'ils touchent une pastille déjà posée, 2 crans au plus */
    const l = M.marqueurs.map((m, i) => ({m, i})).filter(o => !estIv(o.m) && o.m.camp === c && o.m.t >= a && o.m.t <= b)
      .sort((p, q) => (q.m.action === 'but') - (p.m.action === 'but') || p.m.t - q.m.t);
    const pris = [[], [], []], touche = (k, x, d) => pris[k].some(o => Math.abs(o - x) < d);
    l.forEach(({m, i}) => {
      const x = PX(m.t), but = m.action === 'but';
      let k = 0;
      if (but){ pris[0].push(x); pris[1].push(x); }
      else { while (k < 1 && touche(k, x, 24)) k++; pris[k].push(x); }
      const d = info.get(m) || {}, tige = (TIGE[m.action] || 14) + k * 22;
      const pa = `<span class="pa">${m.action === 'faute' ? (d.cfd ? 'CFD' : d.n || '') : IC[m.action] || ''}</span>`, t = `<span class="tige" style="height:${tige}px"></span>`;
      const sc = m.action === 'but' ? `<span class="sc">${d.score}</span>` : '';
      const cls = `fa-ev ${c} ${m.action}${d.cfd ? ' cfd' : ''}${sel === m ? ' sel' : ''}`;
      parts.push(c === 'nous'
        ? `<i class="${cls}" data-i="${i}" style="left:${X(m.t)}%;bottom:${FA_H - FA_AXE}px">${sc}${pa}${t}</i>`
        : `<i class="${cls}" data-i="${i}" style="left:${X(m.t)}%;top:${FA_AXE + 18}px">${t}${pa}${sc}</i>`);
    });
  });
  parts.push('<i class="fa-tete" id="fz-tete"></i>');
  f.innerHTML = parts.join('');
  $('#fr-a').textContent = hms(a); $('#fr-b').textContent = hms(b);
  $('#fz-txt').textContent = Z ? 'Zoom : ' + hms(b - a) : '';
  const lg = $('#fw-leg');
  if (lg && !lg.innerHTML) lg.innerHTML = `<span><i class="b">${IC.but}</i>But</span><span><i>${IC.tir}</i>Tir</span><span><i>${IC.arret}</i>Arrêt</span><span><i>${IC.perte}</i>Perte</span><span><i>${IC.recup}</i>Récup.</span><span><i class="f">7</i>Faute</span><span><i class="cfd"></i>Coup franc direct</span><span><i class="sup"></i>Sup.</span><span><i class="inf"></i>Inf.</span>`;
  teteMaj(); majBug(true);
}
function teteMaj(){
  const t = $('#fz-tete'); if (!t || !M) return;

/* le score par-dessus la vidéo et les fautes d'équipe au-dessus de la frise, à l'instant de la vidéo */
let bugAvant = '';
function majBug(forcer){
  if (!M) return;
  const c = maintenant(), n = compter(c, 'but', 'nous'), e = compter(c, 'but', 'eux'), fn = compter(c, 'faute', 'nous'), fe = compter(c, 'faute', 'eux');
  const cle = [n, e, fn, fe].join('|'); if (cle === bugAvant && !forcer) return; bugAvant = cle;
  const lm = leMatch(), adv = lm.adv || 'Adversaire';
  const ecusson = (src, nom) => src ? `<img src="${esc(src)}" alt="">` : `<i class="crest">${esc(nom.slice(0, 3).toUpperCase())}</i>`;
  const bug = $('#bug'); if (bug) bug.innerHTML = `<span>${ecusson(ctx.logo, 'SAGC')}Cestas</span><span class="sc">${n} - ${e}</span><span>${esc(adv)}${ecusson(lm.logo, adv)}</span>`;
  const qn = $('#eq-n'), qe = $('#eq-e');
  if (qn) qn.innerHTML = `Cestas · fautes <b class="${fn >= 9 ? 'alerte' : ''}">${fn}</b>`;
  if (qe) qe.innerHTML = `${esc(adv)} · fautes <b class="${fe >= 9 ? 'alerte' : ''}">${fe}</b>`;
}
function zoomer(f, autour){
  const [a, b] = fenetre(), l = Math.max(20, Math.min(DUREE, (b - a) * f)), c = autour != null ? autour : Math.min(b, Math.max(a, maintenant()));
  const r = (c - a) / (b - a || 1);
  Z = l >= DUREE ? null : [c - l * r, c - l * r + l];
  friseDessiner();
}
let tip = null;
function friseBrancher(){
  const f = $('#frise'); if (!f) return;
  if (!tip){ tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip); }
  const instantX = e => { const r = f.getBoundingClientRect(), [a, b] = fenetre(); return a + (e.clientX - r.left) / r.width * (b - a); };
  f.onclick = e => {
    if (D) return;
    const el = e.target.closest('[data-i]');
    if (el){ const m = M.marqueurs[+el.dataset.i]; if (m) jouerClip(m, true); return; }
    arreterClip(); cacherCalque(); M.carte = false; aller(Math.max(0, instantX(e))); liste();
  };
  f.onmousemove = e => {
    const el = e.target.closest('[data-i]'); if (!el){ tip.hidden = true; return; }
    const m = M.marqueurs[+el.dataset.i]; if (!m){ tip.hidden = true; return; }
    const d = detailTag(m, analyse());
    tip.innerHTML = `<b>${titreTag(m)}</b>${d ? d + '<br>' : ''}<small>${hms(m.t)}${m.dessin ? ' · ✏️ dessin' : ''} · clic : le clip</small>`;
    tip.hidden = false; tip.style.left = Math.min(innerWidth - 260, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 16) + 'px';
  };
  f.onmouseleave = () => { tip.hidden = true; };
  f.onwheel = e => {
    e.preventDefault();
    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)){
      const [a, b] = fenetre(), d = (e.deltaX || e.deltaY) / 400 * (b - a); Z = [a + d, b + d]; friseDessiner(); return;
    }
    zoomer(e.deltaY > 0 ? 1.4 : 1 / 1.4, instantX(e));
  };
  const z = $('.fw-z'); if (z) z.onclick = e => {
    const b = e.target.closest('[data-z]'); if (!b) return;
    if (b.dataset.z === 'tout'){ Z = null; friseDessiner(); } else zoomer(b.dataset.z === 'plus' ? 1 / 2.5 : 2.5);
  };
}
addEventListener('resize', () => { if (M && M.video) friseDessiner(); });

/* un clip : lecture du début à la fin, arrêt sur le dessin s'il y en a un, puis pause à la fin ; la carte du tag s'ouvre */
function jouerClip(m, carte){
  if (D) return;
  if (M.sel !== m) M.regle = false;
  M.sel = m; if (carte) M.carte = true;
  arreterClip(); cacherCalque();
  aller(debutClip(m), true);
  lecture = {m, t0: Date.now(), vu: false};
  liste();
}
function arreterClip(){ lecture = null; }
function tic(){
  if (!M || !joueur) return;
  teteMaj(); majBug();
  if (M.marqueurs.some(m => estIv(m) && m.t2 == null)) friseDessiner();
  if (!lecture) return;
  const m = lecture.m, c = maintenant(), a = debutClip(m), b = finClip(m), joue = joueur.getPlayerState && joueur.getPlayerState() === 1;
  /* la vidéo a été envoyée ailleurs (frise, flèches, lecteur) : le clip s'arrête de surveiller */
  if (Date.now() - lecture.t0 > 1500 && (c < a - 3 || c > b + 3)){ lecture = null; return; }
  if (m.dessin && !lecture.vu && c >= m.t - .08){ lecture.vu = true; try { joueur.pauseVideo(); } catch(e){} aller(m.t); afficherDessin(m); return; }
  if (joue && (!estIv(m) || m.t2 != null) && c >= b - .05){ try { joueur.pauseVideo(); } catch(e){} lecture = null; afficherFin(m); }
}
/* fin d'un clip : Rejouer, ou Continuer le match (la carte du tag se referme) */
function afficherFin(m){
  const c = $('#calque'); if (!c || D) return;
  c.hidden = false; c.className = 'calque lecture';
  c.innerHTML = `<div class="cq-bas"><button type="button" class="btn btn-ghost" data-cq="rejouer" style="background:rgba(11,15,12,.85)">↺ Rejouer</button><button type="button" class="btn btn-acid" data-cq="continuer">Continuer ▶</button></div>`;
  c.onclick = e => {
    const b = e.target.closest('[data-cq]'); if (!b) return;
    if (b.dataset.cq === 'rejouer') jouerClip(m);
    else { cacherCalque(); M.carte = false; M.regle = false; liste(); if (joueur && joueur.playVideo) joueur.playVideo(); }
  };
}
/* les boutons Supériorité / Infériorité disent quand un intervalle est ouvert */
function majBoutons(){
  ['sup', 'inf'].forEach(a => {
    const b = document.querySelector(`#barre [data-act="${a}"]`); if (!b) return;
    const ouvert = M.marqueurs.some(m => m.action === a && m.t2 == null);

}

/* la carte du tag choisi (Clément, 18.11) : seulement quand on vient de toucher un tag ; ▶ Rejouer · ⏱ Régler · ✏️ Dessin · ✕ ;
   les − / + n'apparaissent qu'après « Régler », « OK » les referme ; « Continuer » ou un clic ailleurs referment la carte */
function majReglage(){
  const r = $('#reglage'); if (!r || !M) return;
  const m = M.sel;
  if (!m || typeof m.id !== 'number' || D || !M.carte){ r.innerHTML = ''; return; }
  const iv = estIv(m), e = M.ecrire, info = analyse(), d = detailTag(m, info);
  const pas = (champ, sens) => `<button type="button" class="ot" data-rg="${champ}" data-s="${sens}" aria-label="${sens > 0 ? 'Plus' : 'Moins'}">${sens > 0 ? '+' : '−'}</button>`;
  const perso = !iv && (m.av != null || m.ap != null);
  r.innerHTML = `<div class="selc"><span class="q">${titreTag(m)}<small>${d ? d + ' · ' : ''}${hms(m.t)}${m.dessin ? ' · ✏️' : ''}</small></span><span class="esp"></span>
    <button type="button" class="ot" data-rg="lire">▶ Rejouer</button>
    ${e ? `<button type="button" class="ot" data-rg="regler" aria-pressed="${!!M.regle}">⏱ Régler</button><button type="button" class="ot" data-rg="dessin">✏️ Dessin</button>
      <button type="button" class="ot sup" data-rg="supprimer" title="Supprimer ce tag (touche Suppr)">🗑 Supprimer</button>` : ''}
    <button type="button" class="ot x2" data-rg="fermer" aria-label="Fermer la carte" title="Fermer la carte">✕</button>
    ${e && M.regle ? `<div class="rgl">${iv
      ? `Début ${pas('t', -1)}<b>${hms(m.t)}</b>${pas('t', 1)} · Fin ${m.t2 == null ? '<b>en cours</b>' : `${pas('t2', -1)}<b>${hms(m.t2)}</b>${pas('t2', 1)}`}`
      : `Démarre ${pas('av', -1)}<b>${avDe(m)} s</b>${pas('av', 1)} avant · s'arrête ${pas('ap', -1)}<b>${apDe(m)} s</b>${pas('ap', 1)} après${perso ? '<button type="button" class="lien-mini" data-rg="defaut">durées de la catégorie</button>' : ''}`}
      <span class="esp"></span><button type="button" class="btn btn-acid" data-rg="ok">OK</button></div>` : ''}</div>`;
  r.onclick = ev => {
    const b = ev.target.closest('[data-rg]'); if (!b) return;
    const k = b.dataset.rg, s = +b.dataset.s || 0;
    if (k === 'lire') return jouerClip(m);
    if (k === 'regler'){ M.regle = !M.regle; return majReglage(); }
    if (k === 'ok'){ M.regle = false; return majReglage(); }
    if (k === 'fermer'){ M.carte = false; M.regle = false; return liste(); }
    if (k === 'supprimer') return retirer(m.id);
    if (k === 'dessin'){ arreterClip(); cacherCalque(); aller(m.t); setTimeout(ouvrirDessin, 350); return; }
    if (k === 'defaut') return reglerClip(m, {av: null, ap: null});
    if (k === 'av') return reglerClip(m, {av: Math.max(0, Math.min(120, avDe(m) + s))});
    if (k === 'ap') return reglerClip(m, {ap: Math.max(0, Math.min(120, apDe(m) + s))});
    if (k === 't') return reglerClip(m, {t: Math.max(0, Math.min(m.t2 != null ? m.t2 : 1e9, m.t + s))});
    if (k === 't2' && m.t2 != null) return reglerClip(m, {t2: Math.max(m.t, m.t2 + s)});
  };
}
async function reglerClip(m, champs){
  const avant = {t: m.t, t2: m.t2, av: m.av, ap: m.ap};
  Object.assign(m, champs); liste();
  const d = await api('/marqueur/modifier', {id: m.id, ...champs});
  if (!d.ok){ Object.assign(m, avant); liste(); toast(raison(d)); return; }
  Object.assign(m, d.marqueur); liste();
}

/* ---------- le dessin sur la vidéo en pause (étape 2, Clément 18.11) ----------
   Rattaché à un tag : celui qu'on vient de toucher ou de poser s'il est à 2 s près, sinon un tag « Moment » créé à l'instant.
   Coordonnées de 0 à 1 sur l'image (le service les garde ainsi), tracées dans un SVG de 1600 × 900, la taille de l'écran 16/9. */
const VB = [1600, 900];
/* ---------- l'éditeur de dessin (Clément, 18.11 : « un vrai éditeur, comme celui des schémas ») ----------
   Comme l'atelier de schémas : on attrape un élément avec n'importe quel outil ; choisi, il montre ses poignées (flèche et
   ligne : départ, milieu pour courber, arrivée ; rond, zone, trait à main levée : coin pour la taille ; texte : il se déplace,
   double-clic pour le réécrire) ; la barre règle sa couleur, son trait (fin, moyen, épais), les pointillés, la taille et le
   gras d'un texte ; Dupliquer, Supprimer. Sans élément choisi, ces réglages sont le style des suivants (le dernier sert).
   Clavier : flèches pour déplacer (Maj × 5), Suppr, Ctrl+Z, Ctrl+D, Échap (désélectionne, puis ferme).
   Une forme : {k, c, p, w?, d?, s?, b?, t?} ; k : fl flèche, li ligne, tr main levée, ce rond, re zone, tx texte ;
   p : points de 0 à 1 (fl / li : départ, arrivée, milieu facultatif ; ce : centre, bord ; re : deux coins ; tr : le tracé) ;
   w : trait 1 fin, 2 moyen, 3 épais ; d : pointillés ; s : taille du texte 1 à 3 ; b : gras. */
const COULEURS = [['#f2e400', 'Jaune'], ['#eaf0e8', 'Blanc'], ['#3fa845', 'Vert'], ['#6fa8d8', 'Bleu'], ['#ff7a45', 'Orange'], ['#0b0f0c', 'Noir']];
const SVGI = (d, plein) => `<svg viewBox="0 0 16 16">${plein ? `<path d="${d}" fill="currentColor"/>` : `<path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`}</svg>`;
const OUTILS = [
  ['fl', 'Flèche', SVGI('M2 14L13 3M13 3H7M13 3v6')],
  ['li', 'Ligne', SVGI('M2 14L14 2')],
  ['tr', 'Main levée', SVGI('M2 12c3-6 5 2 8-3s3-4 4-5')],
  ['ce', 'Rond', '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>'],
  ['re', 'Zone', '<svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="1.8"/></svg>'],
  ['tx', 'Texte', SVGI('M3 3h10M8 3v10')]];
const NOM_FORME = {fl: 'Flèche', li: 'Ligne', tr: 'Trait à main levée', ce: 'Rond', re: 'Zone', tx: 'Texte'};
const EP = [0, 5, 8, 13], TX_T = [0, 38, 54, 78];
const px = p => [p[0] * VB[0], p[1] * VB[1]];
const f1 = v => v.toFixed(1);
/* le chemin d'une flèche ou d'une ligne : droit, ou courbé par le point du milieu (le trait passe par lui) */
function chemin(s){
  const a = px(s.p[0]), b = px(s.p[1]);
  if (!s.p[2]) return {d: `M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}`, fin: [a, b]};
  const m = px(s.p[2]), q = [2 * m[0] - (a[0] + b[0]) / 2, 2 * m[1] - (a[1] + b[1]) / 2];
  return {d: `M${f1(a[0])} ${f1(a[1])}Q${f1(q[0])} ${f1(q[1])} ${f1(b[0])} ${f1(b[1])}`, fin: [q, b]};
}
function forme(s, n){
  const c = esc(s.c), w = EP[s.w || 2], tirets = s.d ? ` stroke-dasharray="${w * 2.2} ${w * 1.8}"` : '';
  const trait = `stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"${tirets}`;
  const prise = n != null ? ` data-n="${n}"` : '', large = `stroke="transparent" stroke-width="${Math.max(34, w + 26)}" fill="none" stroke-linecap="round"`;
  if (s.k === 'tr'){ const pts = s.p.map(q => px(q).map(f1).join(',')).join(' '); return `<g${prise}><polyline points="${pts}" ${large}/><polyline points="${pts}" ${trait}/></g>`; }
  const a = px(s.p[0]), b = s.p[1] ? px(s.p[1]) : null;
  if (s.k === 'ce'){ const r = f1(Math.hypot(b[0] - a[0], b[1] - a[1])); return `<g${prise}><circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="${r}" ${large}/><circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="${r}" ${trait}/></g>`; }
  if (s.k === 're'){ const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]), W = Math.abs(b[0] - a[0]), H = Math.abs(b[1] - a[1]);
    return `<g${prise}><rect x="${f1(x)}" y="${f1(y)}" width="${f1(W)}" height="${f1(H)}" rx="10" fill="${c}" fill-opacity=".22" stroke="${c}" stroke-width="${w}"${tirets}/></g>`; }
  if (s.k === 'tx') return `<g${prise}><text x="${f1(a[0])}" y="${f1(a[1])}" fill="${c}" stroke="${s.c === '#0b0f0c' ? '#eaf0e8' : '#0b0f0c'}" stroke-width="${(TX_T[s.s || 2] / 6).toFixed(1)}" paint-order="stroke" font-family="Inter,sans-serif" font-weight="${s.b ? 900 : 700}" font-size="${TX_T[s.s || 2]}" dominant-baseline="middle">${esc(s.t)}</text></g>`;
  /* flèche et ligne : la pointe suit la direction d'arrivée du trait, courbé ou non */
  const {d, fin: [q, e]} = chemin(s);
  let pointe = '';
  if (s.k === 'fl'){
    const ang = Math.atan2(e[1] - q[1], e[0] - q[0]), L = 26 + w * 2.2, W = 15 + w * 1.2;
    const g = [e[0] - Math.cos(ang) * L + Math.sin(ang) * W, e[1] - Math.sin(ang) * L - Math.cos(ang) * W], dr = [e[0] - Math.cos(ang) * L - Math.sin(ang) * W, e[1] - Math.sin(ang) * L + Math.cos(ang) * W];

const svgDessin = (f, plus) => `<svg viewBox="0 0 ${VB[0]} ${VB[1]}" preserveAspectRatio="none" aria-hidden="true">${f.map((s, n) => forme(s, plus ? n : null)).join('')}${plus || ''}</svg>`;
const decrire = mq => `${esc(NOM_ACTION[mq.action] || mq.action)} · ${mq.camp === 'nous' ? 'Nous' : 'Eux'} · ${hms(mq.t)}`;

function cacherCalque(){
  const c = $('#calque'); if (!c || D) return;
  c.hidden = true; c.className = 'calque'; c.innerHTML = '';
}
/* afficher un dessin à l'arrêt, avec Continuer (et Modifier pour qui peut écrire) */
function afficherDessin(mq){
  const c = $('#calque'); if (!c || !mq.dessin) return;
  c.hidden = false; c.className = 'calque lecture';
  c.innerHTML = svgDessin(mq.dessin.f) + `<div class="cq-bas">${M.ecrire && typeof mq.id === 'number' ? '<button type="button" class="btn btn-ghost" data-cq="modifier" style="background:rgba(11,15,12,.85)">✏️ Modifier</button>' : ''}<button type="button" class="btn btn-acid" data-cq="continuer">Continuer ▶</button></div>`;
  c.onclick = e => {

    else { M.sel = mq; ouvrirDessin(); }

/* les poignées de l'élément choisi : [index du point ou « taille », x, y] en unités 1600 × 900 */
function poignees(s){
  if (s.k === 'fl' || s.k === 'li'){ const a = px(s.p[0]), b = px(s.p[1]), m = s.p[2] ? px(s.p[2]) : [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; return [[0, ...a], [2, ...m], [1, ...b]]; }
  if (s.k === 'ce'){ const b = px(s.p[1]); return [[1, ...b]]; }
  if (s.k === 're'){ return [[0, ...px(s.p[0])], [1, ...px(s.p[1])]]; }
  if (s.k === 'tr'){ const xs = s.p.map(q => q[0]), ys = s.p.map(q => q[1]); return [['taille', Math.max(...xs) * VB[0], Math.max(...ys) * VB[1]]]; }
  return [];
}
/* le cadre pointillé autour de l'élément choisi */
function cadre(s){
  let xs, ys;
  if (s.k === 'ce'){ const a = px(s.p[0]), b = px(s.p[1]), r = Math.hypot(b[0] - a[0], b[1] - a[1]); xs = [a[0] - r, a[0] + r]; ys = [a[1] - r, a[1] + r]; }
  else if (s.k === 'tx'){ const a = px(s.p[0]), h = TX_T[s.s || 2]; xs = [a[0] - 8, a[0] + h * .58 * (s.t || '').length + 8]; ys = [a[1] - h * .65, a[1] + h * .65]; }
  else { const pts = s.p.map(px); xs = pts.map(q => q[0]); ys = pts.map(q => q[1]); }
  const x0 = Math.min(...xs) - 14, y0 = Math.min(...ys) - 14, x1 = Math.max(...xs) + 14, y1 = Math.max(...ys) + 14;
  return `<rect x="${f1(x0)}" y="${f1(y0)}" width="${f1(x1 - x0)}" height="${f1(y1 - y0)}" rx="8" fill="none" stroke="#f2e400" stroke-width="2.5" stroke-dasharray="10 8" pointer-events="none"/>`;
}

const point = e => { const r = $('#calque').getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))].map(v => Math.round(v * 1000) / 1000); };
const borne = v => Math.round(Math.min(1, Math.max(0, v)) * 1000) / 1000;
/* l'historique : une copie avant chaque changement, Ctrl+Z ou ↶ revient d'un pas */
function memo(){ D.hist.push(JSON.stringify(D.f)); if (D.hist.length > 80) D.hist.shift(); D.modifie = true; }
function annuler(){ if (!D || !D.hist.length) return; D.f = JSON.parse(D.hist.pop()); if (D.sel != null && D.sel >= D.f.length) D.sel = null; outils(); trace(); }
/* le style des éléments suivants, ou de l'élément choisi */
const styleDe = () => D.sel != null ? D.f[D.sel] : D.style;

async function ouvrirDessin(){
  if (!M || !M.ecrire || !joueur || D) return;
  arreterClip();
  try { joueur.pauseVideo(); } catch(e){}
  const t = Math.round(maintenant() * 10) / 10;
  let mq = M.sel && typeof M.sel.id === 'number' && Math.abs(M.sel.t - t) <= 2 ? M.sel : null, cree = false;
  if (!mq){
    cree = true;
    const d = await api('/marqueur', {match: M.k, t, action: 'moment', camp: M.camp});
    if (!d.ok){ toast(raison(d)); return; }
    mq = {...d.marqueur, neuf: true}; M.marqueurs.push(mq);
  } else aller(mq.t);
  M.sel = mq; liste(); $('#qui').innerHTML = '';
  let style; try { style = JSON.parse(lire('sagc-video-style') || 'null'); } catch(e){}
  D = {mq, cree, f: JSON.parse(JSON.stringify((mq.dessin || {}).f || [])), outil: 'fl', sel: null, cur: null, prise: null, hist: [], modifie: false,
    style: {c: COULEURS[0][0], w: 2, d: false, s: 2, b: false, ...(style || {})}};
  $('#barre').hidden = true;
  const c = $('#calque'); c.hidden = false; c.className = 'calque edit'; c.onclick = null;
  outils(); trace();
  c.onpointerdown = e => {
    if (!D || e.button > 0 || e.target.closest('.cq-tx')) return;
    const p = point(e), h = e.target.closest('[data-h]'), g = e.target.closest('[data-n]');
    /* une poignée de l'élément choisi */
    if (h && D.sel != null){ e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch(er){} memo(); D.prise = {type: 'poignee', h: h.dataset.h, depart: p, avant: JSON.parse(JSON.stringify(D.f[D.sel]))}; return; }
    /* un élément : on le choisit et on peut le déplacer, quel que soit l'outil */
    if (g){
      e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch(er){}
      const n = +g.dataset.n;
      D.sel = n; memo(); D.prise = {type: 'deplacer', depart: p, avant: JSON.parse(JSON.stringify(D.f[n])), bouge: false}; outils(); trace(); return;
    }
    /* le vide : un clic désélectionne ; avec un outil, on trace un nouvel élément */
    if (D.sel != null){ D.sel = null; outils(); trace(); return; }
    if (D.outil === 'tx'){ texteA(p); return; }
    e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch(er){}
    const st = D.style;
    D.cur = {k: D.outil, c: st.c, w: st.w, ...(st.d ? {d: true} : {}), p: D.outil === 'tr' ? [p] : [p, p]}; trace();
  };
  c.onpointermove = e => {
    if (!D) return;
    const p = point(e);
    if (D.prise){
      const s = D.f[D.sel], a = D.prise.avant, dx = p[0] - D.prise.depart[0], dy = p[1] - D.prise.depart[1];
      if (D.prise.type === 'deplacer'){ s.p = a.p.map(q => [borne(q[0] + dx), borne(q[1] + dy)]); D.prise.bouge = true; }
      else if (D.prise.h === 'taille'){
        /* main levée : on l'agrandit depuis son coin haut gauche */
        const xs = a.p.map(q => q[0]), ys = a.p.map(q => q[1]), x0 = Math.min(...xs), y0 = Math.min(...ys), lx = Math.max(.01, Math.max(...xs) - x0), ly = Math.max(.01, Math.max(...ys) - y0);
        const k = Math.max(.15, Math.min((lx + dx) / lx, (ly + dy) / ly));
        s.p = a.p.map(q => [borne(x0 + (q[0] - x0) * k), borne(y0 + (q[1] - y0) * k)]);
      }
      else { s.p = a.p.map(q => q.slice()); s.p[+D.prise.h] = p; }
      trace(); return;
    }
    if (!D.cur) return;
    if (D.cur.k === 'tr'){ const q = D.cur.p[D.cur.p.length - 1]; if (Math.hypot(p[0] - q[0], p[1] - q[1]) > .004) D.cur.p.push(p); }
    else D.cur.p[1] = p;
    trace();

  c.onpointerup = c.onpointercancel = () => {
    if (!D) return;
    if (D.prise){ if (D.prise.type === 'deplacer' && !D.prise.bouge) D.hist.pop(); D.prise = null; outils(); trace(); return; }
    if (!D.cur) return;
    const s = D.cur; D.cur = null;
    const long = s.k === 'tr' ? s.p.length > 2 : Math.hypot(s.p[1][0] - s.p[0][0], s.p[1][1] - s.p[0][1]) > .012;
    if (long){ memo(); D.f.push(s); D.sel = D.f.length - 1; }
    outils(); trace();
  };
  /* double-clic sur un texte : le réécrire */
  c.ondblclick = e => {
    const g = e.target.closest('[data-n]'); if (!D || !g) return;
    const n = +g.dataset.n; if (!D.f[n] || D.f[n].k !== 'tx') return;
    D.sel = n; outils(); trace(); texteA(D.f[n].p[0], n);
  };
}
function trace(){
  const c = $('#calque'); if (!c || !D) return;
  const champ = c.querySelector('.cq-tx');
  const s = D.sel != null ? D.f[D.sel] : null;
  const plus = s ? cadre(s) + poignees(s).map(([h, x, y]) => `<circle data-h="${h}" cx="${f1(x)}" cy="${f1(y)}" r="${h === 2 ? 13 : 16}" fill="${h === 2 ? '#0b0f0c' : '#f2e400'}" stroke="${h === 2 ? '#f2e400' : '#0b0f0c'}" stroke-width="4" style="cursor:${h === 'taille' ? 'nwse-resize' : 'grab'}"/>`).join('') : '';
  c.innerHTML = svgDessin(D.cur ? [...D.f, D.cur] : D.f, plus || ' ');
  if (champ) c.appendChild(champ);
}
/* le texte : un champ à l'endroit touché (ou sur le texte à réécrire) ; Entrée pose, Échap annule */
function texteA(p, n){
  const c = $('#calque'); c.querySelectorAll('.cq-tx').forEach(x => x.remove());
  const st = n != null ? D.f[n] : D.style;
  const i = document.createElement('input'); i.className = 'cq-tx'; i.maxLength = 80; i.placeholder = 'Texte, puis Entrée';
  if (n != null) i.value = D.f[n].t;
  i.style.left = Math.min(p[0] * 100, 70) + '%'; i.style.top = `calc(${p[1] * 100}% - 18px)`; i.style.color = st.c === '#0b0f0c' ? '#eaf0e8' : st.c;
  c.appendChild(i); setTimeout(() => { i.focus(); i.select(); });
  let fait = false;
  const poser = () => {
    if (fait) return; fait = true; const t = i.value.trim(); i.remove(); if (!D) return;
    if (n != null){ if (t && t !== D.f[n].t){ memo(); D.f[n].t = t; } }
    else if (t){ memo(); D.f.push({k: 'tx', c: st.c, s: st.s, ...(st.b ? {b: true} : {}), p: [p], t}); D.sel = D.f.length - 1; }
    outils(); trace();
  };
  i.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter'){ e.preventDefault(); poser(); } else if (e.key === 'Escape'){ fait = true; i.remove(); } };
  i.onblur = poser;
}
/* la barre : outils, puis la mise en forme de l'élément choisi (ou du style des suivants), puis Annuler, Fermer, Enregistrer */
function outils(){
  const o = $('#outils'); if (!o || !D) return;
  o.hidden = false;
  const s = D.sel != null ? D.f[D.sel] : null, st = styleDe(), estTexte = s ? s.k === 'tx' : D.outil === 'tx', avecTrait = s ? s.k !== 'tx' : D.outil !== 'tx';
  const choix = (attr, v, actuel, label, titre) => `<button type="button" class="ot mini${actuel === v ? ' on' : ''}" data-${attr}="${v}" aria-pressed="${actuel === v}"${titre ? ` title="${titre}"` : ''}>${label}</button>`;
  o.innerHTML = `<p class="sur">Dessin sur <b>${decrire(D.mq)}</b> · ${s ? `<b class="choisi">${NOM_FORME[s.k]}</b> choisi : tire-le, ses poignées, ou règle-le ci-dessous` : 'touche un élément pour le modifier, ou trace avec un outil'}</p>
    <div class="ou-l">${OUTILS.map(([k, nom, ic]) => `<button type="button" class="ot${D.outil === k ? ' on' : ''}" data-ou="${k}" aria-pressed="${D.outil === k}">${ic}${nom}</button>`).join('')}</div>
    <div class="ou-l ou-f">
      <span class="ou-g">${COULEURS.map(([c, nom]) => `<button type="button" class="coul${st.c === c ? ' on' : ''}" data-co="${c}" style="background:${c}" aria-label="${nom}" title="${nom}"></button>`).join('')}</span>
      ${avecTrait ? `<span class="ou-g"><span class="lb">Trait</span>${choix('ep', 1, st.w || 2, 'Fin')}${choix('ep', 2, st.w || 2, 'Moyen')}${choix('ep', 3, st.w || 2, 'Épais')}${choix('pt', 1, st.d ? 1 : 0, '┄ Pointillés', 'Pointillés')}</span>` : ''}
      ${estTexte ? `<span class="ou-g"><span class="lb">Texte</span>${choix('ts', 1, st.s || 2, 'Petit')}${choix('ts', 2, st.s || 2, 'Moyen')}${choix('ts', 3, st.s || 2, 'Grand')}${choix('gr', 1, st.b ? 1 : 0, '<b>G</b>', 'Gras')}${s ? '<button type="button" class="ot mini" data-od="reecrire">✎ Réécrire</button>' : ''}</span>` : ''}
      ${s ? `<span class="ou-g"><button type="button" class="ot mini" data-od="dupliquer" title="Ctrl+D">⧉ Dupliquer</button><button type="button" class="ot mini" data-od="devant">Devant</button><button type="button" class="ot mini sup" data-od="supprimer" title="Suppr">🗑 Supprimer</button></span>` : ''}
    </div>
    <div class="ou-l">
      <button type="button" class="ot" data-od="annuler"${D.hist.length ? '' : ' disabled style="opacity:.4"'} title="Ctrl+Z">↶ Annuler</button>
      <button type="button" class="ot" data-od="effacer"${D.f.length ? '' : ' disabled style="opacity:.4"'}>Tout effacer</button>
      <span class="esp"></span>
      <button type="button" class="btn btn-ghost" data-od="fermer">Fermer</button>
      <button type="button" class="btn btn-acid" data-od="garder">Enregistrer</button></div>`;
  o.onclick = e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const sel = D.sel != null ? D.f[D.sel] : null;
    /* un réglage : sur l'élément choisi (avec historique), et toujours sur le style des suivants */
    const regler = (cle, v) => { if (sel){ memo(); if (v === false) delete sel[cle]; else sel[cle] = v; } if (v === false) delete D.style[cle]; else D.style[cle] = v; garderStyle(); outils(); trace(); };
    if (b.dataset.ou){ D.outil = b.dataset.ou; D.sel = null; outils(); trace(); return; }
    if (b.dataset.co) return regler('c', b.dataset.co);
    if (b.dataset.ep) return regler('w', +b.dataset.ep);
    if (b.dataset.pt) return regler('d', (sel ? !sel.d : !D.style.d) || false);
    if (b.dataset.ts) return regler('s', +b.dataset.ts);
    if (b.dataset.gr) return regler('b', (sel ? !sel.b : !D.style.b) || false);
    const a = b.dataset.od;
    if (a === 'annuler') annuler();
    else if (a === 'effacer'){ memo(); D.f = []; D.sel = null; outils(); trace(); }
    else if (a === 'supprimer') supprimer();
    else if (a === 'dupliquer') dupliquer();
    else if (a === 'devant' && sel){ memo(); D.f.splice(D.sel, 1); D.f.push(sel); D.sel = D.f.length - 1; outils(); trace(); }
    else if (a === 'reecrire' && sel) texteA(sel.p[0], D.sel);

}
function garderStyle(){ try { localStorage.setItem('sagc-video-style', JSON.stringify(D.style)); } catch(e){} }
function supprimer(){ if (!D || D.sel == null) return; memo(); D.f.splice(D.sel, 1); D.sel = null; outils(); trace(); }
function dupliquer(){
  if (!D || D.sel == null) return;
  memo(); const s = JSON.parse(JSON.stringify(D.f[D.sel])); s.p = s.p.map(q => [borne(q[0] + .025), borne(q[1] + .035)]);
  D.f.push(s); D.sel = D.f.length - 1; outils(); trace();
}
/* déplacer l'élément choisi au clavier : 0,5 % par flèche, 2,5 % avec Maj */
function pousser(dx, dy){
  if (!D || D.sel == null) return;
  memo(); const s = D.f[D.sel]; s.p = s.p.map(q => [borne(q[0] + dx), borne(q[1] + dy)]); trace();
}
function fermerDessin(sansDemander){
  if (!D) return;

  const mq = D.mq, cree = D.cree; D = null;
  /* le tag « Moment » créé pour ce dessin, refermé sans rien garder : on le retire, pas de tag vide dans la liste */
  if (cree && !mq.dessin){
    const i = M.marqueurs.indexOf(mq); if (i >= 0) M.marqueurs.splice(i, 1);

async function garderDessin(){
  if (!D) return;
  const mq = D.mq, b = $('#outils [data-od="garder"]'); if (b){ b.disabled = true; b.textContent = 'Enregistrement…'; }
  const d = await api('/marqueur/dessin', {id: mq.id, dessin: D.f.length ? {f: D.f} : null});

  mq.dessin = d.marqueur.dessin;

/* supprimer un tag (Clément, 20.11 : tout de suite, avec « Annuler » 6 secondes) : depuis la carte, la poubelle de la liste
   ou la touche Suppr. Annuler le recrée tel quel : instant, fin, durées, joueur et dessin */
async function retirer(id){
  if (!M) return;
  const i = M.marqueurs.findIndex(m => m.id === id); if (i < 0) return;
  const li = document.querySelector(`#mqs [data-li="${id}"]`); if (li){ li.classList.add('part'); await new Promise(r => setTimeout(r, 200)); }
  const j = M.marqueurs.findIndex(m => m.id === id); if (j < 0) return;
  const [m] = M.marqueurs.splice(j, 1);
  if (M.sel === m){ M.sel = null; M.carte = false; M.regle = false; }
  if (M.dernier === m){ M.dernier = null; const q = $('#qui'); if (q) q.innerHTML = ''; }
  liste();
  const d = await api('/marqueur/retirer', {id});
  if (!d.ok){ M.marqueurs.push(m); liste(); toast(raison(d)); return; }
  toast(`${(TUILE[m.action] || [''])[0]} ${NOM_ACTION[m.action]} à ${hms(m.t)} supprimé.`, 'Annuler', async () => {
    const r = await api('/marqueur', {match: M.k, t: m.t, action: m.action, camp: m.camp, joueur: m.joueur || '', t2: m.t2, av: m.av, ap: m.ap});
    if (!r.ok){ toast(raison(r)); return; }
    const neuf = {...r.marqueur, neuf: true};
    if (m.dessin){ const dd = await api('/marqueur/dessin', {id: neuf.id, dessin: m.dessin}); if (dd.ok) neuf.dessin = dd.marqueur.dessin; }
    M.marqueurs.push(neuf); M.sel = neuf; liste();
  });
}

let toastT = null;
function toast(texte, bouton, faire){
  document.querySelectorAll('.toast').forEach(t => t.remove()); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(texte)}</span>${bouton ? `<button type="button">${esc(bouton)}</button>` : ''}`;
  if (bouton) t.querySelector('button').onclick = () => { t.remove(); faire(); };
  document.body.appendChild(t); toastT = setTimeout(() => t.remove(), 6000);
}

/* le clavier, hors des champs (le lecteur YouTube garde les touches quand on a cliqué dedans) */
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName)) return;
  /* pendant un dessin : Échap désélectionne puis ferme, Ctrl+Z annule, Ctrl+D duplique, Suppr retire l'élément choisi,
     les flèches le déplacent (Maj : 5 fois plus) ; le reste attend */
  if (D){
    const ctrl = e.ctrlKey || e.metaKey, k = e.key;
    if (k === 'Escape'){ e.preventDefault(); if (D.sel != null){ D.sel = null; outils(); trace(); } else fermerDessin(); }
    else if (ctrl && (k === 'z' || k === 'Z')){ e.preventDefault(); annuler(); }
    else if (ctrl && (k === 'd' || k === 'D')){ e.preventDefault(); dupliquer(); }
    else if ((k === 'Delete' || k === 'Backspace') && D.sel != null){ e.preventDefault(); supprimer(); }
    else if (k.startsWith('Arrow') && D.sel != null){
      e.preventDefault(); const pas = e.shiftKey ? .025 : .005;
      pousser(k === 'ArrowLeft' ? -pas : k === 'ArrowRight' ? pas : 0, k === 'ArrowUp' ? -pas : k === 'ArrowDown' ? pas : 0);
    }
    return;
  }
  if (e.key === 'Escape' && DANS_APPLI){ fermer(); return; }
  if ((e.key === 'd' || e.key === 'D') && M && M.video && M.ecrire && !e.ctrlKey && !e.metaKey){ e.preventDefault(); ouvrirDessin(); return; }
  if (!M || !M.video || !M.ecrire || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName)) return;
  const n = +e.key;
  if (n >= 1 && n <= ACTIONS.length && !e.shiftKey){ e.preventDefault(); marquer(ACTIONS[n - 1][0]); return; }
  if (e.key === 'c' || e.key === 'C'){ e.preventDefault(); choisirCamp(M.camp === 'nous' ? 'eux' : 'nous'); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && M.sel && typeof M.sel.id === 'number'){ e.preventDefault(); retirer(M.sel.id); return; }
  if (!joueur || !joueur.getPlayerState) return;
  if (e.key === ' '){ e.preventDefault(); joueur.getPlayerState() === 1 ? joueur.pauseVideo() : joueur.playVideo(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ e.preventDefault(); aller(maintenant() + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 5)); }
});

function route(){
  const k = decodeURIComponent(location.hash.slice(1));
  M = null; document.body.classList.remove('cockpit');
  if (k){ vueMatch(k); return; }
  $('#retour').textContent = "← SAGC'TOUT";
  vueChoix();
}
/* le retour en haut : d'un match vers la liste, de la liste vers l'appli */
$('#retour').onclick = e => { e.preventDefault(); if (location.hash.length > 1) va(''); else fermer(); };
window.addEventListener('hashchange', route);
route();

/* version du pas-à-pas : qui a vu l'ancien (sans le dessin) voit une fois la nouvelle étape */
/* v3 (frise) : qui a vu une version d'avant revoit à partir de la frise (puis le dessin) */
const GUIDE_V = '4', GUIDE_DESSIN = GUIDE.findIndex(s => /clips/.test(s.t));
let gdI = -1;
function guide(i, sens){
  gdI = i;
  let g = $('#gd'); if (!g){ g = document.createElement('div'); g.id = 'gd'; g.className = 'gd'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-modal', 'true'); g.setAttribute('aria-labelledby', 'gd-t'); document.body.appendChild(g); }
  const s = GUIDE[i], der = i === GUIDE.length - 1;
  g.innerHTML = `<div class="gd-c"><div class="gd-pas${sens < 0 ? ' ret' : ''}"><div class="gd-num">Pas à pas · ${i + 1} sur ${GUIDE.length}</div><h2 class="gd-t" id="gd-t">${s.t}</h2>
      <div class="gd-vis" aria-hidden="true">${s.vis}</div><p class="gd-p">${s.p}</p><p class="gd-p m">${s.m}</p></div>
    <div class="gd-bas"><div class="gd-pts">${GUIDE.map((x, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>
      ${i ? '<button type="button" class="btn btn-ghost" data-gd="-1">Retour</button>' : '<button type="button" class="btn btn-ghost" data-gd="fin">Passer</button>'}
      <button type="button" class="btn btn-acid" data-gd="${der ? 'fin' : '1'}">${der ? "C'est parti" : 'Suivant'}</button></div></div>`;
  g.onclick = e => { const b = e.target.closest('[data-gd]'); if (!b) return; b.dataset.gd === 'fin' ? finGuide() : guide(gdI + +b.dataset.gd, +b.dataset.gd); };
  g.querySelector('[data-gd]:last-child').focus();
}
function finGuide(){
  const g = $('#gd'); if (g) g.remove(); gdI = -1;
  try { localStorage.setItem('sagc-video-guide', GUIDE_V); } catch(e){}
}
$('#guide-btn').onclick = () => guide(0, 1);
document.addEventListener('keydown', e => {
  if (gdI < 0) return;
  e.stopImmediatePropagation();
  if (e.key === 'Escape') finGuide();
  else if (e.key === 'ArrowRight' && gdI < GUIDE.length - 1) guide(gdI + 1, 1);
  else if (e.key === 'ArrowLeft' && gdI > 0) guide(gdI - 1, -1);
}, true);
{ const vu = lire('sagc-video-guide'); if (!vu) guide(0, 1); else if (vu !== GUIDE_V) guide(GUIDE_DESSIN, 1); }
})();
