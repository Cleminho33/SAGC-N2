<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F0C">
<meta name="robots" content="noindex">
<title>SAGC'TOUT · Vidéo</title>
<link rel="stylesheet" href="fonts/polices.css">
<!-- Module vidéo de SAGC'TOUT, lot 1 (Clément, 18.11) : marquer les actions d'un match sur sa vidéo YouTube.
     Page publiée en clair à côté de l'appli : elle ne contient aucune donnée. Tout passe par le service sagc-video
     (livrables/Rink/site/video/worker.js), avec la session de SAGC'TOUT (même adresse, même stockage).
     L'appli lui laisse le contexte dans localStorage « sagc-video-ctx » : {matchs: [{k, titre}], joueurs: [{id, nom, num}]}.
     Voir livrables/Rink/MODULE-VIDEO-CADRAGE.md. -->
<style>
:root{
  --ink:#0B0F0C; --ink-2:#131A15; --ink-3:#1B241D; --line:#26332A; --line-2:#37473A;
  --bone:#EAF0E8; --muted:#8D9A8E; --acid:#F2E400; --grass:#3FA845; --deep:#009444; --away:#6FA8D8; --shot:#FF7A45;
  --grad-flat:linear-gradient(90deg,#F2E400 0%,#A9C400 45%,#009444 100%);
  --r-s:10px; --r-l:18px; --r-pill:999px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--bone);font:400 15px/1.5 Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1320px;margin:0 auto;padding:16px 16px 48px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;font:600 12px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font:600 11px/1.2 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.h1{font:400 clamp(30px,5vw,46px)/1 Anton,Impact,sans-serif;text-transform:uppercase;font-style:italic;margin:6px 0 0}
.rule{height:3px;width:72px;background:var(--grad-flat);border-radius:var(--r-pill);margin:14px 0 20px}
.muted{color:var(--muted)}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:var(--r-s);font:600 13px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.btn-acid{background:var(--acid);color:var(--ink)}
.btn-ghost{border:1px solid var(--line-2)}
.btn:disabled{opacity:.5;cursor:default}
.champ{width:100%;padding:12px 14px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--ink-3);font-size:15px}
.champ:focus{outline:2px solid var(--acid);outline-offset:1px}
.msg{font-size:14px;margin:10px 0 0;min-height:1.4em}
.msg.err{color:var(--shot)}

/* le choix du match */
.liste{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.mt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-radius:var(--r-l);background:var(--ink-2);border:1px solid var(--line)}
.mt:hover{border-color:var(--line-2)}
.mt b{font-weight:800;font-size:16px}
.mt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.pas{font:600 11px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pas.ok{border-color:var(--grass);color:var(--grass)}

/* le marquage */
.grille{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 360px;align-items:start}
@media (max-width:980px){.grille{grid-template-columns:1fr}}
.ecran{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line)}
.ecran iframe,.ecran #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.barre{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.camp{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:3px;margin-right:6px}
.camp button{padding:9px 14px;border-radius:var(--r-pill);font:700 12px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.camp button.on[data-camp=nous]{background:var(--grass);color:var(--ink)}
.camp button.on[data-camp=eux]{background:var(--away);color:var(--ink)}
.act{display:inline-flex;align-items:center;gap:8px;padding:11px 13px;border-radius:var(--r-s);background:var(--ink-3);border:1px solid var(--line-2);font-weight:600;font-size:14px;transition:transform .12s,border-color .12s}
.act:hover{border-color:var(--bone)}
.act kbd{font:700 11px/1 Inter,sans-serif;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:3px 5px}
.act.but{background:var(--acid);border-color:var(--acid);color:var(--ink)}
.act.but kbd{color:var(--ink);border-color:rgba(11,15,12,.35)}
.act.flash{transform:scale(.94)}
.aide{font-size:12.5px;color:var(--muted);margin-top:10px}
.aide kbd{font:700 11px/1 Inter,sans-serif;border:1px solid var(--line-2);border-radius:5px;padding:2px 5px;color:var(--bone)}
.qui{margin-top:12px;padding:12px;border-radius:var(--r-s);background:var(--ink-2);border:1px solid var(--line-2)}
.qui p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.qui p b{color:var(--bone)}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{padding:7px 11px;border-radius:var(--r-pill);border:1px solid var(--line-2);font-size:13px;font-weight:600}
.puce:hover{border-color:var(--bone)}
.puce em{font-style:normal;color:var(--muted);margin-right:4px}

.cote h2{font:800 18px/1.2 Inter,sans-serif;margin:0}
.bilan{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:13px;margin:12px 0 4px}
.bilan span:nth-child(3n+2){color:var(--grass);font-weight:700;text-align:right}
.bilan span:nth-child(3n){color:var(--away);font-weight:700;text-align:right}
.bilan .tete{font:600 10.5px/1.4 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)!important}
.mqs{list-style:none;margin:14px 0 0;padding:0;max-height:62vh;overflow:auto;border-top:1px solid var(--line)}
.mq{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.mq.neuf{animation:neuf .9s ease-out}
@keyframes neuf{from{background:rgba(242,228,0,.16)}to{background:transparent}}
.mq .va{flex:1;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.mq time{font:700 13px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;min-width:52px;color:var(--bone)}
.mq .pt{width:8px;height:8px;border-radius:50%;flex:none}
.mq .pt.nous{background:var(--grass)}.mq .pt.eux{background:var(--away)}
.mq b{font-weight:600;font-size:14px}
.mq small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mq .x{width:30px;height:30px;border-radius:var(--r-pill);color:var(--muted);font-size:18px;line-height:1}
.mq .x:hover{color:var(--bone);background:var(--ink-3)}
.vide{color:var(--muted);font-size:14px;padding:14px 0}
.toast{position:fixed;left:50%;bottom:22px;translate:-50% 0;background:var(--ink-3);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:9}
.toast button{font-weight:700;color:var(--acid);padding:6px 8px}
.lien{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lien .champ{flex:1 1 320px}
/* le dessin sur la vidéo en pause (étape 2, 18.11) : un calque par-dessus le lecteur, en coordonnées 1600 × 900 */
.calque{position:absolute;inset:0;z-index:2}
.calque[hidden]{display:none}
.calque svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.calque.edit{cursor:crosshair;touch-action:none;background:rgba(11,15,12,.08);box-shadow:inset 0 0 0 3px var(--acid)}
.calque.lecture{pointer-events:none}
.calque.lecture .cq-bas{pointer-events:auto}
.cq-bas{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.cq-bas .btn{box-shadow:0 6px 18px rgba(0,0,0,.45)}
.cq-tx{position:absolute;min-width:160px;padding:8px 10px;border-radius:8px;border:2px solid var(--acid);background:rgba(11,15,12,.9);font:800 15px Inter,sans-serif;outline:none}
.act.dess{border-style:dashed}
.outils{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:var(--r-s);background:var(--ink-2);border:1px solid var(--acid)}
.outils[hidden]{display:none}
.outils .sur{flex-basis:100%;font-size:13px;color:var(--muted);margin:0 0 2px}
.outils .sur b{color:var(--bone)}
.ot{display:inline-flex;align-items:center;gap:6px;padding:9px 11px;border-radius:var(--r-s);border:1px solid var(--line-2);font-weight:600;font-size:13.5px}
.ot.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.ot svg{width:16px;height:16px}
.coul{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink-2);box-shadow:0 0 0 1px var(--line-2)}
.coul.on{box-shadow:0 0 0 2px var(--bone)}
.outils .esp{flex:1}
.mq.sel{background:rgba(242,228,0,.07)}
.lb{font-size:12.5px;color:var(--muted)}
.esp{flex:1}
/* la frise du match (18.11) : nous en haut, eux en bas, supériorités et infériorités au milieu */
.fw{margin-top:10px;padding:10px 12px 8px;border-radius:var(--r-s);background:var(--ink-2);border:1px solid var(--line)}
.fw-haut{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.fw-leg{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fw-leg .pt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px}
.pt.iv-sup{background:var(--acid)}.pt.iv-inf{background:var(--shot)}
.fw-leg .pt.nous{background:var(--grass)}.fw-leg .pt.eux{background:var(--away)}
.fw-z{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.fw-z .ot{padding:5px 9px;font-size:12px}
.frise{position:relative;height:76px;border-radius:8px;background:var(--ink);cursor:pointer;overflow:hidden;touch-action:pan-y}
.frise i{position:absolute;display:block}
.fz-axe{left:0;right:0;top:38px;height:1px;background:var(--line-2)}
.fz-clip{height:10px;border-radius:3px;opacity:.38}
.fz-clip.h{top:13px}.fz-clip.b{top:53px}
.fz-clip.nous{background:var(--grass)}.fz-clip.eux{background:var(--away)}
.fz-tag{width:3px;height:24px;margin-left:-1.5px;border-radius:2px}
.fz-tag.h{top:6px}.fz-tag.b{top:46px}
.fz-tag.nous{background:var(--grass)}.fz-tag.eux{background:var(--away)}
.fz-tag.but{width:5px;margin-left:-2.5px;box-shadow:0 0 0 1px var(--bone)}
.fz-iv{top:33px;height:10px;border-radius:5px;opacity:.9}
.fz-iv.sup{background:var(--acid)}.fz-iv.inf{background:var(--shot)}
.fz-iv.ouvert{background-image:repeating-linear-gradient(45deg,rgba(11,15,12,.35) 0 6px,transparent 6px 12px);background-size:17px 17px;animation:raye 1s linear infinite}
@keyframes raye{to{background-position:17px 0}}
.frise .sel{outline:2px solid var(--bone);outline-offset:1px;opacity:1;z-index:2}
.fz-tete{top:0;bottom:0;width:2px;margin-left:-1px;background:var(--bone);z-index:3;pointer-events:none}
.fz-tete::before{content:'';position:absolute;top:-1px;left:-4px;border:5px solid transparent;border-top-color:var(--bone)}
.fw-temps{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.act.ouvert{border-color:var(--acid);box-shadow:0 0 0 2px rgba(242,228,0,.3);animation:pulse 1.4s ease-in-out infinite}
.act.inf.ouvert{border-color:var(--shot);box-shadow:0 0 0 2px rgba(255,122,69,.3)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(242,228,0,.12)}}
/* le réglage d'un tag et les durées par catégorie */
.rg{margin-top:10px;padding:12px;border-radius:var(--r-s);background:var(--ink-2);border:1px solid var(--line-2)}
.rg-t{margin:0 0 8px;font-size:13.5px}
.rg-l{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rg-l .ot,.du .ot{padding:6px 10px}
.rg-v{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.rg .btn{padding:9px 12px}
.lien-mini{font-size:12px;color:var(--muted);text-decoration:underline;margin-left:4px}
.mini{position:relative;height:40px;margin-top:10px;border-radius:8px;background:var(--ink);touch-action:none}
.mini i{position:absolute;display:block}
.mi-clip{top:14px;height:12px;border-radius:3px;opacity:.5}
.mi-clip.nous{background:var(--grass)}.mi-clip.eux{background:var(--away)}.mi-clip.sup{background:var(--acid)}.mi-clip.inf{background:var(--shot)}
.mi-tag{top:8px;width:3px;height:24px;margin-left:-1.5px;background:var(--bone);border-radius:2px}
.poignee{top:5px;width:12px;height:30px;margin-left:-6px;border-radius:4px;background:var(--ink-2);border:2px solid var(--bone);cursor:ew-resize;z-index:2}
.poignee:hover{border-color:var(--acid)}
.mi-a,.mi-b{position:absolute;bottom:-17px;font-size:11px;color:var(--muted)}
.mi-a{left:0}.mi-b{right:0}
.mini{margin-bottom:16px}
.du{display:grid;grid-template-columns:minmax(110px,auto) auto auto;gap:6px 14px;align-items:center;font-size:13.5px}
.du-c{display:inline-flex;align-items:center;gap:6px}
.du-c b{min-width:34px;text-align:center}
.mq .crayon{font-size:13px;margin-left:4px}
.haut{display:flex;align-items:center;justify-content:space-between;gap:12px}
.aide-btn{width:36px;height:36px;border-radius:var(--r-pill);border:1px solid var(--line-2);font:800 15px/1 Inter,sans-serif;color:var(--muted)}
.aide-btn:hover{color:var(--bone);border-color:var(--bone)}

/* le pas-à-pas de la première fois (Clément, 18.11) : comment c'est câblé, puis comment s'en servir */
.gd{position:fixed;inset:0;z-index:20;background:rgba(5,8,6,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:gdIn .25s ease}
@keyframes gdIn{from{opacity:0}}
.gd-c{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--ink-2);border:1px solid var(--line-2);border-radius:var(--r-l);padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.gd-num{font:600 11px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.gd-t{font:400 30px/1.05 Anton,Impact,sans-serif;font-style:italic;text-transform:uppercase;margin:8px 0 12px}
.gd-t em{font-style:inherit;color:var(--acid)}
.gd-p{margin:0 0 6px;font-size:15px}
.gd-p.m{color:var(--muted);font-size:13.5px}
.gd-vis{height:150px;margin:4px 0 16px;border-radius:var(--r-s);background:var(--ink);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px}
.gd-pas{animation:pasIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pasIn{from{opacity:0;transform:translateX(18px)}}
.gd-pas.ret{animation-name:pasRet}
@keyframes pasRet{from{opacity:0;transform:translateX(-18px)}}
.gd-bas{display:flex;align-items:center;gap:10px;margin-top:16px}
.gd-pts{display:flex;gap:6px;flex:1}
.gd-pts i{width:7px;height:7px;border-radius:50%;background:var(--line-2);transition:width .2s,background .2s}
.gd-pts i.on{width:20px;border-radius:var(--r-pill);background:var(--acid)}
.gd-bas .btn{padding:11px 14px}
/* les petits dessins de chaque étape */
.nd{flex:1;min-width:0;text-align:center;padding:10px 6px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--ink-2);font-size:12px;line-height:1.3;color:var(--muted)}
.nd b{display:block;color:var(--bone);font-size:13.5px;margin-bottom:3px}
.nd.yt b{color:#ff4e45}
.nd.app b{color:var(--acid)}
.nd.sv b{color:var(--grass)}
.fl{flex:none;width:30px;height:2px;background:var(--line-2);position:relative}
.fl::after{content:'';position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--acid);animation:flux 1.6s linear infinite}
.fl.b::after{animation-delay:.8s}
@keyframes flux{from{left:-4px;opacity:0}20%{opacity:1}80%{opacity:1}to{left:26px;opacity:0}}
.faux-champ{width:86%;padding:12px 14px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--ink-3);font-size:14px;color:var(--bone);white-space:nowrap;overflow:hidden}
.faux-champ span{display:inline-block;overflow:hidden;vertical-align:bottom;width:0;border-right:2px solid var(--acid);animation:tape 2.6s steps(30) infinite}
@keyframes tape{0%{width:0}60%,100%{width:30ch}}
.mini-acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mini-acts kbd{font:700 12px/1 Inter,sans-serif;padding:8px 9px;border-radius:7px;border:1px solid var(--line-2);color:var(--bone);background:var(--ink-3);animation:appui 4s infinite}
.mini-acts kbd.but{background:var(--acid);color:var(--ink);border-color:var(--acid)}
@keyframes appui{0%,8%{transform:none;box-shadow:none}4%{transform:scale(.88);box-shadow:0 0 0 4px rgba(242,228,0,.35)}}
.gfrise{position:absolute;left:14px;right:14px;bottom:14px;height:4px;border-radius:4px;background:var(--line)}
.gfrise i{position:absolute;top:-4px;width:3px;height:12px;border-radius:2px;background:var(--acid);animation:tag 4s infinite backwards}
@keyframes tag{0%{opacity:0;transform:scaleY(0)}10%,100%{opacity:1;transform:none}}
.mini-camp{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:3px;position:relative}
.mini-camp span{position:relative;z-index:1;padding:8px 14px;font:700 12px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.mini-camp span+span{color:var(--muted);animation:campTxt 3s infinite}
.mini-camp span:first-child{animation:campTxt2 3s infinite}
.mini-camp::before{content:'';position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:var(--r-pill);background:var(--grass);animation:camp 3s infinite}
@keyframes camp{0%,40%{transform:none;background:var(--grass)}50%,90%{transform:translateX(100%);background:var(--away)}100%{transform:none;background:var(--grass)}}
@keyframes campTxt{0%,40%{color:var(--muted)}50%,90%{color:var(--ink)}}
@keyframes campTxt2{0%,40%{color:var(--ink)}50%,90%{color:var(--muted)}}
.mini-liste{width:88%;display:grid;gap:6px}
.mini-liste div{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--ink-2);border:1px solid var(--line);font-size:12.5px}
.mini-liste div b{font-variant-numeric:tabular-nums}
.mini-liste div:nth-child(2){animation:clic 2.4s infinite}
@keyframes clic{0%,30%{border-color:var(--line)}40%,70%{border-color:var(--acid);background:rgba(242,228,0,.08)}}
.gfr{position:relative;width:100%;height:90px;border-radius:8px;background:var(--ink-2)}
.gfr i{position:absolute;display:block}
.gfr .ax{left:0;right:0;top:45px;height:1px;background:var(--line-2)}
.gfr .cl{height:10px;border-radius:3px;opacity:.38}.gfr .cl.n{top:18px;background:var(--grass)}.gfr .cl.e{top:62px;background:var(--away)}
.gfr .tg{width:3px;height:22px;border-radius:2px}.gfr .tg.n{top:12px;background:var(--grass)}.gfr .tg.e{top:56px;background:var(--away)}
.gfr .iv{top:40px;height:10px;border-radius:5px;background:var(--acid);opacity:.9}
.gfr .tt{top:0;bottom:0;width:2px;background:var(--bone);animation:tete 6s linear infinite}
@keyframes tete{from{left:2%}to{left:98%}}
.mini-dessin{width:100%;max-width:340px}
.mini-dessin svg{width:100%;height:auto;display:block}
.mini-dessin .trace{stroke-dasharray:200;stroke-dashoffset:200;animation:trace 3.2s ease-in-out infinite}
.mini-dessin .pointe{opacity:0;animation:pointe 3.2s infinite}
.mini-dessin .rond{stroke-dasharray:130;stroke-dashoffset:130;animation:rond 3.2s ease-in-out infinite}
@keyframes trace{0%{stroke-dashoffset:200}35%,100%{stroke-dashoffset:0}}
@keyframes pointe{0%,34%{opacity:0}38%,100%{opacity:1}}
@keyframes rond{0%,45%{stroke-dashoffset:130}75%,100%{stroke-dashoffset:0}}
.bientot{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.bientot div{padding:12px;border-radius:var(--r-s);border:1px dashed var(--line-2);font-size:12.5px;color:var(--muted);text-align:left}
.bientot b{display:block;color:var(--bone);font-size:13.5px;margin-bottom:4px}
@media (max-width:520px){.gd-vis{height:auto;min-height:130px;gap:6px;padding:10px}.fl{display:none}.nd{padding:8px 4px;font-size:11.5px}.nd b{font-size:12.5px}.gd-t{font-size:26px}}
@media (prefers-reduced-motion:reduce){.mq.neuf{animation:none}.act{transition:none}.mini-dessin *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}.gd,.gd-pas,.fl::after,.faux-champ span,.mini-acts kbd,.gfrise i,.gfr .tt,.fz-iv.ouvert,.act.ouvert,.mini-camp::before,.mini-camp span,.mini-liste div{animation:none!important}.faux-champ span{width:auto;border:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="haut"><a class="back" id="retour" href="./#/stats/club">← SAGC'TOUT</a><button type="button" class="aide-btn" id="guide-btn" aria-label="Comment ça marche" title="Comment ça marche">?</button></div>
  <main id="v" aria-live="polite"></main>
</div>
<script>
(() => {
'use strict';
const VIDEO_URL = window.VIDEO_URL || 'https://sagc-video.clement-mora11.workers.dev';
/* dans l'appli (18.11) : la page est ouverte en plein écran par-dessus SAGC'TOUT, dans un cadre ; on change d'écran sans
   ajouter d'étape à l'historique, pour que le retour du téléphone ferme la vidéo d'un coup, comme une fiche */
const DANS_APPLI = (() => { try { return window.parent !== window; } catch(e){ return true; } })();
function va(k){
  if (DANS_APPLI){ try { history.replaceState(null, '', k ? '#' + k : location.pathname); } catch(e){} route(); }
  else location.hash = k;
}
function fermer(){
  if (DANS_APPLI) parent.postMessage({sagcVideo: 'fermer'}, location.origin);
  else location.href = './#/stats/club';
}
const ACTIONS = [
  ['but', 'But'], ['tir', 'Tir'], ['arret', 'Arrêt'], ['perte', 'Perte de balle'],
  ['recup', 'Récupération'], ['faute', 'Faute'], ['sup', 'Supériorité'], ['inf', 'Infériorité']];
/* « moment » : le tag posé par Dessiner quand aucun tag n'est là (pas de bouton ni de touche à lui) */
const NOM_ACTION = {...Object.fromEntries(ACTIONS), moment: 'Moment'};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const lire = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const ctx = (() => { try { return JSON.parse(lire('sagc-video-ctx') || '{}') || {}; } catch(e){ return {}; } })();
const MATCHS = Array.isArray(ctx.matchs) ? ctx.matchs : [], JOUEURS = Array.isArray(ctx.joueurs) ? ctx.joueurs : [];
const nomJoueur = id => { const j = JOUEURS.find(x => x.id === id); return j ? j.nom : id; };
const titreMatch = k => (MATCHS.find(x => x.k === k) || {}).titre || k;
const hms = t => { t = Math.max(0, Math.floor(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };

/* le service : la session de SAGC'TOUT ; « reseau » si le service ne répond pas (pas encore créé, pas de réseau) */
async function api(chemin, corps){
  const ses = lire('sagc-session');
  let r;
  try {
    r = await fetch(VIDEO_URL + chemin, {method: 'POST', headers: {'Content-Type': 'application/json', ...(ses ? {Authorization: 'Bearer ' + ses} : {})}, body: JSON.stringify(corps || {})});
  } catch(e){ return {ok: false, erreur: 'reseau'}; }
  const d = await r.json().catch(() => null);
  return d || {ok: false, erreur: 'reseau'};
}
const RAISON = {
  compte: "Connecte-toi d'abord dans SAGC'TOUT, sur cet appareil, puis reviens ici.",
  lecture: 'Ton compte peut regarder, pas marquer.',
  fort: "Confirme d'abord ton identité dans SAGC'TOUT (Face ID ou mot de passe de secours), puis reviens ici.",
  reseau: "Le service vidéo ne répond pas. S'il vient d'être ajouté, il n'est peut-être pas encore en place dans Cloudflare.",
  lien: "Ce lien n'est pas une vidéo YouTube. Colle l'adresse de la vidéo (youtube.com/watch?v=… ou youtu.be/…).",
  plein: 'Trop de marqueurs sur ce match.', service: 'Le service a eu un souci. Réessaie dans un instant.'
};
const raison = d => RAISON[d && d.erreur] || "Ça n'a pas marché. Réessaie dans un instant.";

/* ---------- le choix du match ---------- */
async function vueChoix(){
  document.title = "SAGC'TOUT · Vidéo";
  const v = $('#v');
  v.innerHTML = `<div class="eyebrow">Après le match</div><h1 class="h1">Vidéo des matchs</h1><div class="rule"></div>
    ${MATCHS.length ? `<p class="muted" style="margin-top:0">Choisis le match à marquer.</p><div class="liste">${MATCHS.slice().sort((a, b) => (b.iso || '').localeCompare(a.iso || '')).map(m => `<a class="mt" href="#${esc(m.k)}" data-k="${esc(m.k)}"><span><b>${esc(m.titre)}</b><small>${esc(m.d || '')}</small></span><span class="pas" data-pas="${esc(m.k)}">Pas de vidéo</span></a>`).join('')}</div>`
      : `<div class="card"><p style="margin:0">Ouvre cette page depuis SAGC'TOUT : <b>Stats › Notre club › Marquer la vidéo</b>.</p></div>`}
    <p class="msg" id="msg"></p>`;
  v.onclick = e => { const a = e.target.closest('a.mt[data-k]'); if (a){ e.preventDefault(); va(a.dataset.k); } };
  if (!MATCHS.length) return;
  const d = await api('/matchs');
  if (!d.ok){ $('#msg').textContent = raison(d); $('#msg').className = 'msg err'; return; }
  d.matchs.forEach(m => { const p = document.querySelector(`[data-pas="${CSS.escape(m.match)}"]`); if (p){ p.textContent = m.n ? `${m.n} action${m.n > 1 ? 's' : ''}` : 'Vidéo, rien de marqué'; p.classList.add('ok'); } });
}

/* ---------- le marquage d'un match ---------- */
let M = null;   // {k, video, marqueurs, ecrire, camp, dernier}
let joueur = null, ytPret = null;
let D = null;   // le dessin en cours : {mq, f: formes, outil, couleur, cur: forme qu'on trace}

function ytCharger(){
  if (ytPret) return ytPret;
  ytPret = new Promise((ok, ko) => {
    if (window.YT && window.YT.Player) return ok();
    window.onYouTubeIframeAPIReady = () => ok();
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => { ytPret = null; ko(new Error('yt')); };
    document.head.appendChild(s);
  });
  return ytPret;
}
const maintenant = () => { try { return joueur && joueur.getCurrentTime ? joueur.getCurrentTime() : 0; } catch(e){ return 0; } };
function aller(t, lire){
  if (!joueur || !joueur.seekTo) return;
  joueur.seekTo(Math.max(0, t), true);
  if (lire && joueur.playVideo) joueur.playVideo();
}

async function vueMatch(k){
  document.title = "SAGC'TOUT · Vidéo · " + titreMatch(k);
  $('#retour').textContent = '← Les matchs';
  const v = $('#v');
  v.innerHTML = `<div class="eyebrow">Vidéo du match</div><h1 class="h1">${esc(titreMatch(k))}</h1><div class="rule"></div><p class="muted">Chargement…</p>`;
  const d = await api('/match', {match: k});
  if (!d.ok){ v.innerHTML = `<div class="eyebrow">Vidéo du match</div><h1 class="h1">${esc(titreMatch(k))}</h1><div class="rule"></div><div class="card"><p style="margin:0">${esc(raison(d))}</p></div>`; return; }
  M = {k, video: d.video, marqueurs: d.marqueurs, ecrire: d.ecrire, pourquoi: d.pourquoi, camp: 'nous', dernier: null, reglages: d.reglages || null};
  dessiner();
}

function dessiner(){
  const v = $('#v'), tete = `<div class="eyebrow">Vidéo du match</div><h1 class="h1">${esc(titreMatch(M.k))}</h1><div class="rule"></div>`;
  joueur = null;
  if (!M.video){
    v.innerHTML = tete + (M.ecrire ? `<div class="card"><b>Colle le lien YouTube du match</b>
        <p class="muted" style="margin:4px 0 0;font-size:13.5px">Le match entier, même s'il dure 1h30 : rien n'est téléchargé, la vidéo reste sur YouTube.</p>
        <form class="lien" id="f-lien"><input class="champ" id="yt-lien" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" required><button class="btn btn-acid">Charger</button></form>
        <p class="msg" id="msg"></p></div>`
      : `<div class="card"><p style="margin:0">Pas encore de vidéo pour ce match.</p></div>`);
    if (M.ecrire){ $('#yt-lien').focus(); $('#f-lien').onsubmit = e => { e.preventDefault(); poserLien($('#yt-lien').value); }; }
    return;
  }
  v.innerHTML = tete + `<div class="grille">
    <section>
      <div class="ecran"><div id="yt"></div><div class="calque" id="calque" hidden></div></div>
      <div class="fw">
        <div class="fw-haut"><span class="fw-leg"><i class="pt nous"></i>Nous <i class="pt eux"></i>Eux <i class="pt iv-sup"></i>Supériorité <i class="pt iv-inf"></i>Infériorité</span>
          <span class="fw-z"><span id="fz-txt"></span><button type="button" class="ot" data-z="moins" aria-label="Dézoomer">−</button><button type="button" class="ot" data-z="plus" aria-label="Zoomer">+</button><button type="button" class="ot" data-z="tout">Tout</button></span></div>
        <div class="frise" id="frise" title="Clic : aller à cet instant · molette : zoomer"></div>
        <div class="fw-temps"><span id="fr-a"></span><span id="fr-b"></span></div>
      </div>
      <div id="reglage"></div>
      ${M.ecrire ? `<div class="barre" id="barre">
        <div class="camp" role="group" aria-label="Pour qui">${['nous', 'eux'].map(c => `<button type="button" data-camp="${c}" class="${M.camp === c ? 'on' : ''}" aria-pressed="${M.camp === c}">${c === 'nous' ? 'Nous' : 'Eux'}</button>`).join('')}</div>
        ${ACTIONS.map(([id, nom], i) => `<button type="button" class="act ${id}" data-act="${id}"><kbd>${i + 1}</kbd>${nom}</button>`).join('')}
        <button type="button" class="act dess" data-dessin="1"><kbd>D</kbd>✏️ Dessiner</button>
      </div>
      <div class="outils" id="outils" hidden></div>
      <div id="qui"></div>
      <p class="aide">Clavier (clique d'abord hors de la vidéo) : <kbd>1</kbd> à <kbd>8</kbd> marquer · <kbd>C</kbd> Nous / Eux · <kbd>D</kbd> dessiner · <kbd>Espace</kbd> lecture · <kbd>←</kbd> <kbd>→</kbd> 5 s · <kbd>Maj</kbd>+<kbd>←</kbd> <kbd>→</kbd> 1 s.
        <button type="button" id="ch-lien" style="text-decoration:underline;color:var(--muted)">Changer le lien</button> ·
        <button type="button" id="ch-durees" style="text-decoration:underline;color:var(--muted)">Durées par catégorie</button></p>
      <div id="durees"></div>`
      : `<p class="aide">${esc(RAISON[M.pourquoi] || '')}</p>`}
    </section>
    <aside class="card cote"><h2>Les actions</h2><div id="bilan"></div><ul class="mqs" id="mqs"></ul></aside>
  </div>`;
  liste();
  if (M.ecrire){
    $('#barre').onclick = e => {
      const c = e.target.closest('[data-camp]'); if (c){ choisirCamp(c.dataset.camp); return; }
      if (e.target.closest('[data-dessin]')){ ouvrirDessin(); return; }
      const a = e.target.closest('[data-act]'); if (a) marquer(a.dataset.act);
    };
    $('#ch-lien').onclick = () => { if (confirm('Changer le lien YouTube de ce match ? Les actions déjà marquées restent, calées sur les mêmes instants.')){ M.video = null; dessiner(); } };
    $('#ch-durees').onclick = () => panneauDurees();
  }
  friseBrancher(); friseDessiner(); majReglage(); majBoutons();
  ytCharger().then(() => {
    /* la lecture repart (bouton du lecteur, Espace, Continuer) : le dessin affiché s'efface */
    joueur = new YT.Player('yt', {videoId: M.video.yt, playerVars: {rel: 0, playsinline: 1, modestbranding: 1},
      events: {onStateChange: e => { if (e.data === 1 && !D) cacherCalque(); }, onReady: () => { DUREE = 0; Z = null; friseDessiner(); }}});
    clearInterval(boucle); boucle = setInterval(tic, 250);
  }).catch(() => { $('.ecran').innerHTML = '<p style="padding:20px;margin:0">Le lecteur YouTube ne se charge pas sur ce réseau.</p>'; });
}

async function poserLien(lien){
  const msg = $('#msg'); msg.className = 'msg'; msg.textContent = 'Enregistrement…';
  const d = await api('/video', {match: M.k, yt: lien, titre: titreMatch(M.k)});
  if (!d.ok){ msg.className = 'msg err'; msg.textContent = raison(d); return; }
  M.video = d.video; dessiner();
}

function choisirCamp(c){
  M.camp = c;
  document.querySelectorAll('#barre [data-camp]').forEach(b => { b.classList.toggle('on', b.dataset.camp === c); b.setAttribute('aria-pressed', b.dataset.camp === c); });
}

async function marquer(action){
  const b = document.querySelector(`[data-act="${action}"]`); if (b){ b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 140); }
  /* supériorité, infériorité : la même touche ouvre puis ferme l'intervalle (Clément, 18.11) */
  if (estIv({action})){
    const ouvert = M.marqueurs.find(m => m.action === action && m.t2 == null && typeof m.id === 'number');
    if (ouvert){
      const t2 = Math.max(ouvert.t, Math.round(maintenant() * 10) / 10);
      ouvert.t2 = t2; M.sel = ouvert; liste();
      const d = await api('/marqueur/modifier', {id: ouvert.id, t2});
      if (!d.ok){ ouvert.t2 = null; liste(); toast(raison(d)); return; }
      Object.assign(ouvert, d.marqueur); liste();
      toast(`${NOM_ACTION[action]} fermée : ${hms(t2 - ouvert.t)} de vidéo.`);
      return;
    }
  }
  const tmp = {id: 'tmp' + Date.now(), t: Math.round(maintenant() * 10) / 10, action, camp: M.camp, joueur: '', neuf: true, t2: null};
  M.marqueurs.push(tmp); M.sel = tmp; liste();
  if (estIv(tmp)){ $('#qui').innerHTML = ''; M.dernier = tmp; } else demanderJoueur(tmp);
  const d = await api('/marqueur', {match: M.k, t: tmp.t, action, camp: tmp.camp});
  const i = M.marqueurs.indexOf(tmp);
  if (!d.ok){ if (i >= 0) M.marqueurs.splice(i, 1); liste(); $('#qui').innerHTML = ''; toast(raison(d)); return; }
  const vrai = {...d.marqueur, neuf: true};
  if (i >= 0) M.marqueurs[i] = vrai;
  if (M.sel === tmp) M.sel = vrai;
  /* un joueur choisi pendant l'envoi */
  if (tmp.joueur){ vrai.joueur = tmp.joueur; api('/marqueur/modifier', {id: vrai.id, joueur: tmp.joueur}); }
  if (M.dernier === tmp) M.dernier = vrai;
  liste();
}

/* après un marqueur pour nous : à qui l'attribuer (facultatif, se ferme au marqueur suivant) */
function demanderJoueur(mq){
  const q = $('#qui'); M.dernier = mq;
  if (mq.camp !== 'nous' || !JOUEURS.length){ q.innerHTML = ''; return; }
  q.innerHTML = `<div class="qui"><p><b>${esc(NOM_ACTION[mq.action])}</b> à ${hms(mq.t)} : qui ? <span style="opacity:.8">(facultatif)</span></p>
    <div class="puces">${JOUEURS.map(j => `<button type="button" class="puce" data-j="${esc(j.id)}">${j.num ? `<em>${esc(j.num)}</em>` : ''}${esc(j.nom)}</button>`).join('')}</div></div>`;
  q.onclick = e => {
    const p = e.target.closest('[data-j]'); if (!p) return;
    const cible = M.dernier; if (!cible) return;
    cible.joueur = p.dataset.j; q.innerHTML = ''; liste();
    if (typeof cible.id === 'number') api('/marqueur/modifier', {id: cible.id, joueur: cible.joueur}).then(d => { if (!d.ok) toast(raison(d)); });
  };
}

function liste(){
  const l = M.marqueurs.slice().sort((a, b) => a.t - b.t), ul = $('#mqs'); if (!ul) return;
  const compte = (a, c) => l.filter(x => x.action === a && x.camp === c).length;
  const vus = ACTIONS.filter(([a]) => compte(a, 'nous') + compte(a, 'eux'));
  $('#bilan').innerHTML = vus.length ? `<div class="bilan"><span class="tete">Action</span><span class="tete">Nous</span><span class="tete">Eux</span>${vus.map(([a, n]) => `<span>${n}</span><span>${compte(a, 'nous')}</span><span>${compte(a, 'eux')}</span>`).join('')}</div>` : '';
  ul.innerHTML = l.length ? l.map(m => `<li class="mq${m.neuf ? ' neuf' : ''}${M.sel === m ? ' sel' : ''}">
      <button type="button" class="va" data-i="${M.marqueurs.indexOf(m)}" title="Revoir le clip"><time>${hms(m.t)}</time><i class="pt ${m.camp}"></i><span style="min-width:0"><b>${esc(NOM_ACTION[m.action] || m.action)}</b>${m.dessin ? '<span class="crayon" title="Avec un dessin">✏️</span>' : ''}<br><small>${m.camp === 'nous' ? 'Nous' : 'Eux'}${m.joueur ? ' · ' + esc(nomJoueur(m.joueur)) : ''}${estIv(m) ? ' · ' + (m.t2 == null ? 'en cours' : hms(m.t2 - m.t)) : ''}${m.parNom ? ' · par ' + esc(m.parNom) : ''}</small></span></button>
      ${M.ecrire && typeof m.id === 'number' ? `<button type="button" class="x" data-x="${m.id}" aria-label="Retirer">×</button>` : ''}</li>`).join('')
    : `<li class="vide">${M.ecrire ? 'Lance la vidéo et touche une action au bon moment.' : 'Rien de marqué pour l\'instant.'}</li>`;
  l.forEach(m => { delete m.neuf; });
  ul.onclick = e => {
    const x = e.target.closest('[data-x]'); if (x){ retirer(+x.dataset.x); return; }
    const va = e.target.closest('[data-i]'); if (!va) return;
    const m = M.marqueurs[+va.dataset.i]; if (!m || D) return;
    M.sel = m; liste(); jouerClip(m);
  };
  friseDessiner(); majReglage(); majBoutons();
}

/* ---------- la frise du match et les clips (Clément, 18.11) ----------
   Frise C : nous au-dessus, eux en dessous, supériorités et infériorités en bande au milieu. Chaque tag est un clip :
   de l'instant moins « avant » à l'instant plus « après » (durées de sa catégorie, ou les siennes) ; un intervalle va de t à t2. */
const DUREES_DEF = {but: [8, 3], tir: [5, 2], arret: [5, 2], perte: [4, 3], recup: [4, 3], faute: [4, 2], moment: [3, 3]};
const estIv = m => m.action === 'sup' || m.action === 'inf';
const dureesDe = a => ((M && M.reglages && M.reglages.durees) || {})[a] || DUREES_DEF[a] || [5, 2];
const avDe = m => m.av != null ? m.av : dureesDe(m.action)[0];
const apDe = m => m.ap != null ? m.ap : dureesDe(m.action)[1];
const debutClip = m => estIv(m) ? m.t : Math.max(0, m.t - avDe(m));
const finClip = m => estIv(m) ? (m.t2 != null ? m.t2 : Math.max(m.t, maintenant())) : m.t + apDe(m);
let DUREE = 0, Z = null, boucle = null, lecture = null;
function dureeVideo(){
  let d = 0; try { d = joueur && joueur.getDuration ? joueur.getDuration() : 0; } catch(e){}
  if (!d) d = Math.max(600, ...M.marqueurs.map(m => finClip(m) + 60));
  return d;
}
/* ce qu'on voit de la frise : [a, b] en secondes (Z), tout le match par défaut */
function fenetre(){
  DUREE = dureeVideo();
  if (!Z) return [0, DUREE];
  const l = Math.max(20, Math.min(DUREE, Z[1] - Z[0])), a = Math.max(0, Math.min(DUREE - l, Z[0]));
  return [a, a + l];
}
function friseDessiner(){
  const f = $('#frise'); if (!f || !M) return;
  const [a, b] = fenetre(), x = s => ((s - a) / (b - a) * 100), dans = (s, e) => e >= a && s <= b;
  const parts = [];
  M.marqueurs.forEach((m, i) => {
    const s = debutClip(m), e = finClip(m); if (!dans(s, e)) return;
    const g = Math.max(0, x(s)), w = Math.max(.4, Math.min(100, x(e)) - g), sel = M.sel === m ? ' sel' : '';
    if (estIv(m)){ parts.push(`<i class="fz-iv ${m.action}${m.t2 == null ? ' ouvert' : ''}${sel}" data-i="${i}" style="left:${g}%;width:${w}%" title="${esc(NOM_ACTION[m.action])} · ${hms(m.t)}${m.t2 != null ? ' → ' + hms(m.t2) : ' · en cours'}"></i>`); return; }
    const ligne = m.camp === 'nous' ? 'h' : 'b';
    parts.push(`<i class="fz-clip ${m.camp} ${ligne}${sel}" data-i="${i}" style="left:${g}%;width:${w}%"></i>`);
    if (m.t >= a && m.t <= b) parts.push(`<i class="fz-tag ${m.camp} ${ligne} ${m.action}${sel}" data-i="${i}" style="left:${x(m.t)}%" title="${esc(NOM_ACTION[m.action] || m.action)} · ${hms(m.t)}${m.joueur ? ' · ' + esc(nomJoueur(m.joueur)) : ''}${m.dessin ? ' · ✏️' : ''}"></i>`);
  });

  $('#fr-a').textContent = hms(a); $('#fr-b').textContent = hms(b);
  $('#fz-txt').textContent = Z ? 'Zoom : ' + hms(b - a) : '';

}
function teteMaj(){

}

/* un clip : lecture du début à la fin, arrêt sur le dessin s'il y en a un, puis pause à la fin */
function jouerClip(m){
  if (D) return;

  const a = debutClip(m);

  lecture = {m, t0: Date.now(), vu: false};
}
function arreterClip(){ lecture = null; }
function tic(){
  if (!M || !joueur) return;
  teteMaj();

  if (!lecture) return;
  const m = lecture.m, c = maintenant(), a = debutClip(m), b = finClip(m), joue = joueur.getPlayerState && joueur.getPlayerState() === 1;
  /* la vidéo a été envoyée ailleurs (frise, flèches, lecteur) : le clip s'arrête de surveiller */
  if (Date.now() - lecture.t0 > 1500 && (c < a - 3 || c > b + 3)){ lecture = null; return; }
  if (m.dessin && !lecture.vu && c >= m.t - .08){ lecture.vu = true; try { joueur.pauseVideo(); } catch(e){} aller(m.t); afficherDessin(m); return; }
  if (joue && !estIv(m) || joue && m.t2 != null) if (c >= b - .05){ try { joueur.pauseVideo(); } catch(e){} lecture = null; afficherFin(m); }
}

}

/* la mini-frise : 10 s de marge autour du clip, poignées à tirer (qui peut écrire) */
function miniDessiner(){

/* ---------- le dessin sur la vidéo en pause (étape 2, Clément 18.11) ----------
   Rattaché à un tag : celui qu'on vient de toucher ou de poser s'il est à 2 s près, sinon un tag « Moment » créé à l'instant.
   Coordonnées de 0 à 1 sur l'image (le service les garde ainsi), tracées dans un SVG de 1600 × 900, la taille de l'écran 16/9. */
const VB = [1600, 900];
const COULEURS = [['#f2e400', 'Jaune'], ['#eaf0e8', 'Blanc'], ['#3fa845', 'Vert'], ['#6fa8d8', 'Bleu'], ['#ff7a45', 'Orange']];
const OUTILS = [
  ['fl', 'Flèche', '<svg viewBox="0 0 16 16"><path d="M2 14L13 3M13 3H7M13 3v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'],
  ['tr', 'Trait', '<svg viewBox="0 0 16 16"><path d="M2 12c3-6 5 2 8-3s3-4 4-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'],
  ['ce', 'Cercle', '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>'],
  ['tx', 'Texte', '<svg viewBox="0 0 16 16"><path d="M3 3h10M8 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>']];
const px = p => [p[0] * VB[0], p[1] * VB[1]];
function forme(s){
  const c = esc(s.c), trait = `stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
  if (s.k === 'tr') return `<polyline points="${s.p.map(q => px(q).map(v => v.toFixed(1)).join(',')).join(' ')}" ${trait}/>`;
  const [a, b] = [px(s.p[0]), s.p[1] ? px(s.p[1]) : null];
  if (s.k === 'ce') return `<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${Math.hypot(b[0] - a[0], b[1] - a[1]).toFixed(1)}" ${trait}/>`;
  if (s.k === 'tx') return `<text x="${a[0].toFixed(1)}" y="${a[1].toFixed(1)}" fill="${c}" stroke="#0b0f0c" stroke-width="9" paint-order="stroke" font-family="Inter,sans-serif" font-weight="800" font-size="52" dominant-baseline="middle">${esc(s.t)}</text>`;
  /* flèche : le trait s'arrête au pied de la pointe, pointe pleine */
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = 38, W = 22, pied = [b[0] - Math.cos(ang) * L * .8, b[1] - Math.sin(ang) * L * .8];
  const g = [b[0] - Math.cos(ang) * L + Math.sin(ang) * W, b[1] - Math.sin(ang) * L - Math.cos(ang) * W], d = [b[0] - Math.cos(ang) * L - Math.sin(ang) * W, b[1] - Math.sin(ang) * L + Math.cos(ang) * W];
  return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${pied[0].toFixed(1)}" y2="${pied[1].toFixed(1)}" ${trait}/><polygon points="${[b, g, d].map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${c}" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`;
}
const svgDessin = f => `<svg viewBox="0 0 ${VB[0]} ${VB[1]}" preserveAspectRatio="none" aria-hidden="true">${f.map(forme).join('')}</svg>`;
const decrire = mq => `${esc(NOM_ACTION[mq.action] || mq.action)} · ${mq.camp === 'nous' ? 'Nous' : 'Eux'} · ${hms(mq.t)}`;

function cacherCalque(){
  const c = $('#calque'); if (!c || D) return;
  c.hidden = true; c.className = 'calque'; c.innerHTML = '';
}
/* afficher un dessin à l'arrêt, avec Continuer (et Modifier pour qui peut écrire) */
function afficherDessin(mq){
  const c = $('#calque'); if (!c || !mq.dessin) return;
  c.hidden = false; c.className = 'calque lecture';
  c.innerHTML = svgDessin(mq.dessin.f) + `<div class="cq-bas">${M.ecrire && typeof mq.id === 'number' ? '<button type="button" class="btn btn-ghost" data-cq="modifier" style="background:rgba(11,15,12,.85)">✏️ Modifier</button>' : ''}<button type="button" class="btn btn-acid" data-cq="continuer">Continuer ▶</button></div>`;
  c.onclick = e => {
    const b = e.target.closest('[data-cq]'); if (!b) return;
    if (b.dataset.cq === 'continuer'){ cacherCalque(); if (joueur && joueur.playVideo) joueur.playVideo(); }

async function ouvrirDessin(){
  if (!M || !M.ecrire || !joueur || D) return;
  arreterClip();
  try { joueur.pauseVideo(); } catch(e){}
  const t = Math.round(maintenant() * 10) / 10;
  let mq = M.sel && typeof M.sel.id === 'number' && Math.abs(M.sel.t - t) <= 2 ? M.sel : null, cree = false;
  if (!mq){
    cree = true;
    const d = await api('/marqueur', {match: M.k, t, action: 'moment', camp: M.camp});
    if (!d.ok){ toast(raison(d)); return; }
    mq = {...d.marqueur, neuf: true}; M.marqueurs.push(mq);
  } else aller(mq.t);
  M.sel = mq; liste(); $('#qui').innerHTML = '';
  D = {mq, cree, f: JSON.parse(JSON.stringify((mq.dessin || {}).f || [])), outil: 'fl', couleur: COULEURS[0][0], cur: null, modifie: false};
  $('#barre').hidden = true;
  const c = $('#calque'); c.hidden = false; c.className = 'calque edit'; c.onclick = null;
  outils(); trace();
  c.onpointerdown = e => {
    if (!D || e.button > 0 || e.target.closest('.cq-tx')) return;
    const p = point(e);
    if (D.outil === 'tx'){ texteA(p); return; }
    e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch(er){}
    D.cur = {k: D.outil, c: D.couleur, p: D.outil === 'tr' ? [p] : [p, p]}; trace();
  };
  c.onpointermove = e => {
    if (!D || !D.cur) return;
    const p = point(e);
    if (D.cur.k === 'tr'){ const q = D.cur.p[D.cur.p.length - 1]; if (Math.hypot(p[0] - q[0], p[1] - q[1]) > .004) D.cur.p.push(p); }
    else D.cur.p[1] = p;
    trace();
  };
  c.onpointerup = c.onpointercancel = () => {
    if (!D || !D.cur) return;
    const s = D.cur; D.cur = null;
    const long = s.k === 'tr' ? s.p.length > 2 : Math.hypot(s.p[1][0] - s.p[0][0], s.p[1][1] - s.p[0][1]) > .012;
    if (long){ D.f.push(s); D.modifie = true; outils(); }
    trace();
  };
}
const point = e => { const r = $('#calque').getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))].map(v => Math.round(v * 1000) / 1000); };
function trace(){
  const c = $('#calque'); if (!c || !D) return;
  const champ = c.querySelector('.cq-tx');
  c.innerHTML = svgDessin(D.cur ? [...D.f, D.cur] : D.f);
  if (champ) c.appendChild(champ);
}
/* le texte : un petit champ à l'endroit touché ; Entrée pose le texte, Échap annule */
function texteA(p){
  const c = $('#calque'); c.querySelectorAll('.cq-tx').forEach(x => x.remove());
  const i = document.createElement('input'); i.className = 'cq-tx'; i.maxLength = 80; i.placeholder = 'Texte, puis Entrée';
  i.style.left = Math.min(p[0] * 100, 70) + '%'; i.style.top = `calc(${p[1] * 100}% - 18px)`; i.style.color = D.couleur;
  c.appendChild(i); setTimeout(() => i.focus());
  let fait = false;
  const poser = () => { if (fait) return; fait = true; const t = i.value.trim(); i.remove(); if (t && D){ D.f.push({k: 'tx', c: D.couleur, p: [p], t}); D.modifie = true; outils(); trace(); } };
  i.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter'){ e.preventDefault(); poser(); } else if (e.key === 'Escape'){ fait = true; i.remove(); } };
  i.onblur = poser;
}
function outils(){
  const o = $('#outils'); if (!o || !D) return;
  o.hidden = false;
  o.innerHTML = `<p class="sur">Dessin sur <b>${decrire(D.mq)}</b> · la vidéo est en pause</p>
    ${OUTILS.map(([k, nom, ic]) => `<button type="button" class="ot${D.outil === k ? ' on' : ''}" data-ou="${k}" aria-pressed="${D.outil === k}">${ic}${nom}</button>`).join('')}
    ${COULEURS.map(([c, nom]) => `<button type="button" class="coul${D.couleur === c ? ' on' : ''}" data-co="${c}" style="background:${c}" aria-label="${nom}" title="${nom}"></button>`).join('')}
    <button type="button" class="ot" data-od="annuler"${D.f.length ? '' : ' disabled style="opacity:.4"'}>↶ Annuler</button>
    <button type="button" class="ot" data-od="effacer"${D.f.length ? '' : ' disabled style="opacity:.4"'}>Tout effacer</button>
    <span class="esp"></span>
    <button type="button" class="btn btn-ghost" data-od="fermer">Fermer</button>
    <button type="button" class="btn btn-acid" data-od="garder">Enregistrer</button>`;
  o.onclick = e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.ou){ D.outil = b.dataset.ou; outils(); return; }
    if (b.dataset.co){ D.couleur = b.dataset.co; outils(); return; }
    const a = b.dataset.od;

    else if (a === 'effacer'){ D.f = []; D.modifie = true; outils(); trace(); }

function fermerDessin(sansDemander){
  if (!D) return;
  if (!sansDemander && D.modifie && !confirm('Fermer sans enregistrer ce dessin ?')) return;
  const mq = D.mq, cree = D.cree; D = null;
  /* le tag « Moment » créé pour ce dessin, refermé sans rien garder : on le retire, pas de tag vide dans la liste */
  if (cree && !mq.dessin){
    const i = M.marqueurs.indexOf(mq); if (i >= 0) M.marqueurs.splice(i, 1);
    if (M.sel === mq) M.sel = null;
    liste(); api('/marqueur/retirer', {id: mq.id});
  }
  $('#outils').hidden = true; $('#outils').innerHTML = ''; $('#barre').hidden = false;
  const c = $('#calque'); c.onpointerdown = c.onpointermove = c.onpointerup = c.onpointercancel = null;
  cacherCalque();
  if (mq.dessin) afficherDessin(mq);
}
async function garderDessin(){
  if (!D) return;
  const mq = D.mq, b = $('#outils [data-od="garder"]'); if (b){ b.disabled = true; b.textContent = 'Enregistrement…'; }
  const d = await api('/marqueur/dessin', {id: mq.id, dessin: D.f.length ? {f: D.f} : null});
  if (!d.ok){ if (b){ b.disabled = false; b.textContent = 'Enregistrer'; } toast(raison(d)); return; }
  mq.dessin = d.marqueur.dessin;
  fermerDessin(true); liste();
  toast(mq.dessin ? 'Dessin enregistré : un clic sur le tag le remontre.' : 'Dessin effacé.');
}

async function retirer(id){
  const i = M.marqueurs.findIndex(m => m.id === id); if (i < 0) return;
  const [m] = M.marqueurs.splice(i, 1); liste();
  const d = await api('/marqueur/retirer', {id});
  if (!d.ok){ M.marqueurs.push(m); liste(); toast(raison(d)); return; }
  toast(`${NOM_ACTION[m.action]} à ${hms(m.t)} retiré.`, 'Annuler', async () => {
    const r = await api('/marqueur', {match: M.k, t: m.t, action: m.action, camp: m.camp, joueur: m.joueur || ''});
    if (r.ok){ M.marqueurs.push({...r.marqueur, neuf: true}); liste(); } else toast(raison(r));
  });
}

let toastT = null;
function toast(texte, bouton, faire){
  document.querySelectorAll('.toast').forEach(t => t.remove()); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(texte)}</span>${bouton ? `<button type="button">${esc(bouton)}</button>` : ''}`;
  if (bouton) t.querySelector('button').onclick = () => { t.remove(); faire(); };
  document.body.appendChild(t); toastT = setTimeout(() => t.remove(), 6000);
}

/* le clavier, hors des champs (le lecteur YouTube garde les touches quand on a cliqué dedans) */
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName)) return;
  /* pendant un dessin : Échap ferme le dessin, Ctrl+Z (Cmd+Z) retire le dernier trait, le reste attend */
  if (D){
    if (e.key === 'Escape'){ e.preventDefault(); fermerDessin(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && D.f.length){ e.preventDefault(); D.f.pop(); D.modifie = true; outils(); trace(); }
    return;
  }
  if (e.key === 'Escape' && DANS_APPLI){ fermer(); return; }
  if ((e.key === 'd' || e.key === 'D') && M && M.video && M.ecrire && !e.ctrlKey && !e.metaKey){ e.preventDefault(); ouvrirDessin(); return; }
  if (!M || !M.video || !M.ecrire || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName)) return;
  const n = +e.key;
  if (n >= 1 && n <= ACTIONS.length && !e.shiftKey){ e.preventDefault(); marquer(ACTIONS[n - 1][0]); return; }
  if (e.key === 'c' || e.key === 'C'){ e.preventDefault(); choisirCamp(M.camp === 'nous' ? 'eux' : 'nous'); return; }
  if (!joueur || !joueur.getPlayerState) return;
  if (e.key === ' '){ e.preventDefault(); joueur.getPlayerState() === 1 ? joueur.pauseVideo() : joueur.playVideo(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ e.preventDefault(); aller(maintenant() + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 5)); }
});

function route(){
  const k = decodeURIComponent(location.hash.slice(1));
  M = null;
  if (k){ vueMatch(k); return; }
  $('#retour').textContent = "← SAGC'TOUT";
  vueChoix();
}
/* le retour en haut : d'un match vers la liste, de la liste vers l'appli */
$('#retour').onclick = e => { e.preventDefault(); if (location.hash.length > 1) va(''); else fermer(); };
window.addEventListener('hashchange', route);
route();

/* version du pas-à-pas : qui a vu l'ancien (sans le dessin) voit une fois la nouvelle étape */
/* v3 (frise) : qui a vu une version d'avant revoit à partir de la frise (puis le dessin) */
const GUIDE_V = '3', GUIDE_DESSIN = GUIDE.findIndex(s => /clips/.test(s.t));
let gdI = -1;
function guide(i, sens){
  gdI = i;
  let g = $('#gd'); if (!g){ g = document.createElement('div'); g.id = 'gd'; g.className = 'gd'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-modal', 'true'); g.setAttribute('aria-labelledby', 'gd-t'); document.body.appendChild(g); }
  const s = GUIDE[i], der = i === GUIDE.length - 1;
  g.innerHTML = `<div class="gd-c"><div class="gd-pas${sens < 0 ? ' ret' : ''}"><div class="gd-num">Pas à pas · ${i + 1} sur ${GUIDE.length}</div><h2 class="gd-t" id="gd-t">${s.t}</h2>
      <div class="gd-vis" aria-hidden="true">${s.vis}</div><p class="gd-p">${s.p}</p><p class="gd-p m">${s.m}</p></div>
    <div class="gd-bas"><div class="gd-pts">${GUIDE.map((x, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>
      ${i ? '<button type="button" class="btn btn-ghost" data-gd="-1">Retour</button>' : '<button type="button" class="btn btn-ghost" data-gd="fin">Passer</button>'}
      <button type="button" class="btn btn-acid" data-gd="${der ? 'fin' : '1'}">${der ? "C'est parti" : 'Suivant'}</button></div></div>`;
  g.onclick = e => { const b = e.target.closest('[data-gd]'); if (!b) return; b.dataset.gd === 'fin' ? finGuide() : guide(gdI + +b.dataset.gd, +b.dataset.gd); };
  g.querySelector('[data-gd]:last-child').focus();
}
function finGuide(){
  const g = $('#gd'); if (g) g.remove(); gdI = -1;
  try { localStorage.setItem('sagc-video-guide', GUIDE_V); } catch(e){}
}
$('#guide-btn').onclick = () => guide(0, 1);
document.addEventListener('keydown', e => {
  if (gdI < 0) return;
  e.stopImmediatePropagation();
  if (e.key === 'Escape') finGuide();
  else if (e.key === 'ArrowRight' && gdI < GUIDE.length - 1) guide(gdI + 1, 1);
  else if (e.key === 'ArrowLeft' && gdI > 0) guide(gdI - 1, -1);
}, true);
{ const vu = lire('sagc-video-guide'); if (!vu) guide(0, 1); else if (vu !== GUIDE_V) guide(GUIDE_DESSIN, 1); }
})();
